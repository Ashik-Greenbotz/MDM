<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Remote Management · Sign in</title>
<style>
  :root {
    --bg: #eceffa; --bg-grad: linear-gradient(135deg, #e6eeff 0%, #f1e8ff 50%, #ffeadb 100%); --edge: rgba(255,255,255,.75);
    --card: rgba(255,255,255,.55); --text: #1d2129; --muted: #5b6472; --line: rgba(29,33,41,.1); --field: rgba(255,255,255,.55);
    --accent: #f28c00; --accent2: #ffb340; --accent-ink: #ffffff; --bad: #e5383b;
    --b1: rgba(242,140,0,.45); --b2: rgba(64,120,255,.32); --b3: rgba(255,90,140,.28); --grid: rgba(0,0,0,.05);
    --ease: cubic-bezier(.2,.8,.2,1); color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #000000; --bg-grad: #000000; --edge: rgba(255,255,255,.08);
    --card: #1c1c1e; --text: #f5f5f7; --muted: #98989d; --line: rgba(84,84,88,.4); --field: #2c2c2e;
    --bad: #ff453a; --b1: rgba(242,140,0,.18); --b2: transparent; --b3: transparent; --grid: transparent; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; align-content: center; padding: 16px; overflow-x: hidden;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -.01em; -webkit-font-smoothing: antialiased; background: var(--bg); color: var(--text); }
  /* aurora: three blurred orbs drifting behind a faint tech grid */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; background: var(--bg-grad); }
  .bg i { position: absolute; width: 55vmax; height: 55vmax; border-radius: 50%; filter: blur(70px); opacity: .9; }
  .bg i:nth-child(1) { background: var(--b1); top: -20vmax; left: -15vmax; animation: orb1 18s ease-in-out infinite alternate; }
  .bg i:nth-child(2) { background: var(--b2); bottom: -25vmax; right: -15vmax; animation: orb2 22s ease-in-out infinite alternate; }
  .bg i:nth-child(3) { background: var(--b3); top: 30%; left: 45%; width: 35vmax; height: 35vmax; animation: orb3 16s ease-in-out infinite alternate; }
  .bg::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 44px 44px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  @keyframes orb1 { to { transform: translate(18vmax, 12vmax) scale(1.15); } }
  @keyframes orb2 { to { transform: translate(-20vmax, -10vmax) scale(1.1); } }
  @keyframes orb3 { to { transform: translate(-25vmax, 10vmax) scale(.85); } }

  .card { position: relative; width: 100%; max-width: 390px; background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 160px), var(--card);
    border: 1px solid var(--edge); border-radius: 28px; padding: 36px 30px 30px; box-shadow: inset 0 1px 0 var(--edge), 0 30px 80px rgba(20,25,70,.2); backdrop-filter: saturate(180%) blur(30px); -webkit-backdrop-filter: saturate(180%) blur(30px);
    animation: enter .9s var(--ease) both; }
  .card > * { animation: rise .7s var(--ease) both; }
  .card > :nth-child(2) { animation-delay: .12s; } .card > :nth-child(3) { animation-delay: .18s; } .card > :nth-child(n+4) { animation-delay: .26s; }
  .card.shake { animation: shake .45s var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(30px) scale(.96); filter: blur(8px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .logo-wrap { position: relative; width: 112px; height: 112px; margin: -4px auto 14px; }
  .logo-wrap::before { content: ""; position: absolute; inset: -6px; border-radius: 30px; background: conic-gradient(from 0deg, var(--accent), var(--accent2), #4078ff, var(--accent));
    filter: blur(14px); opacity: .55; animation: spin 6s linear infinite; }
  .logo { position: relative; display: block; width: 112px; height: 112px; object-fit: contain; border-radius: 26px; background: #fff; animation: float 5s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { 50% { transform: translateY(-5px); } }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.03em; text-align: center; margin: 0 0 4px;
    background: linear-gradient(90deg, var(--text) 20%, var(--accent) 50%, var(--text) 80%); background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: rise .7s var(--ease) both .12s, sheen 6s linear infinite 1s; }
  @keyframes sheen { to { background-position: -200% center; } }
  .copy { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px; }
  p.sub { text-align: center; color: var(--muted); margin: 0 0 26px; font-size: 14px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0 0 7px; }
  input { width: 100%; font: inherit; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); color: var(--text);
    margin-bottom: 18px; transition: border-color .25s, box-shadow .25s, background .25s; }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(242,140,0,.18), 0 0 24px rgba(242,140,0,.15); }
  button#btn { position: relative; overflow: hidden; width: 100%; font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); cursor: pointer;
    box-shadow: 0 10px 30px rgba(242,140,0,.35); transition: transform .2s var(--ease), box-shadow .3s var(--ease); }
  button#btn::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%); transform: translateX(-100%); }
  button#btn:hover { transform: translateY(-1px); box-shadow: 0 14px 38px rgba(242,140,0,.5); }
  button#btn:hover::after { transform: translateX(100%); transition: transform .8s var(--ease); }
  button#btn:active { transform: scale(.98); }
  button#btn:disabled { cursor: default; }
  /* "catch me" state after a wrong password: the button floats free and runs from the pointer (see dodge()) */
  .card.tease #btn { position: fixed; left: 0; top: 0; width: 230px; margin: 0; z-index: 30;
    background: linear-gradient(135deg, var(--bad), #ff6b6e); box-shadow: 0 12px 34px rgba(229,56,59,.45);
    transition: left .18s var(--ease), top .18s var(--ease), background .3s, box-shadow .3s; }
  .card.tease #btn:hover { transform: none; }
  button#btn .dot { display: none; width: 16px; height: 16px; margin-right: 8px; vertical-align: -3px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff;
    border-radius: 50%; animation: spin .8s linear infinite; }
  button#btn:disabled .dot { display: inline-block; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.5em; margin: -6px 0 10px; }
  .theme { position: fixed; top: 16px; right: 16px; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--edge); background: var(--card);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); font-size: 18px; cursor: pointer; transition: transform .3s var(--ease); }
  .theming, .theming * { transition: background-color .45s var(--ease), color .45s var(--ease), border-color .45s var(--ease) !important; }
  .theme:hover { transform: rotate(20deg) scale(1.08); }
  footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 18px; animation: rise .7s var(--ease) both .4s; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<script>
  const themePref = () => { try { return localStorage.getItem("theme") || "auto"; } catch { return "auto"; } };
  const applyTheme = () => document.documentElement.dataset.theme =
    themePref() === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : themePref();
  applyTheme();
</script>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<button class="theme" id="theme" type="button" aria-label="Change theme"></button>
<form class="card" id="form">
  <div class="logo-wrap"><img class="logo" src="/logo.png" alt="Interlock Group"></div>
  <h1>Device Remote Management</h1>
  <p class="sub">Sign in to manage your tablets</p>
  <label for="user">Username</label>
  <input id="user" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required>
  <div class="err" id="err" role="alert"></div>
  <button id="btn"><span class="dot"></span><span id="lbl">Sign in</span></button>
</form>
<footer class="copy">2026 © Interlock Security Systems · Developed by Ashik</footer>
<script>
const THEME_ICON = { auto: "🌓", light: "☀️", dark: "🌙" };
function themeBtn(b, after) {
  const show = () => { b.textContent = THEME_ICON[themePref()]; b.title = "Theme: " + themePref() + " (click to change)"; };
  b.onclick = () => {
    const next = { auto: "light", light: "dark", dark: "auto" }[themePref()];
    try { localStorage.setItem("theme", next); } catch {}
    document.documentElement.classList.add("theming");
    applyTheme(); show(); after?.();
    setTimeout(() => document.documentElement.classList.remove("theming"), 500);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyTheme(); after?.(); });
  show();
}
themeBtn(document.getElementById("theme"));
const card = document.getElementById("form"), btn = document.getElementById("btn"), lbl = document.getElementById("lbl");
const shake = () => { card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake"); };
// After a wrong password the button runs from the pointer and dares you to press Enter instead. Keyboard submit still
// works (Enter), so it stays usable; reduced-motion users just get the new label, no chase.
const pw = document.getElementById("password"), user = document.getElementById("user");
const chase = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const NEAR = 95; // how close the pointer may get before the button bolts
let teasing = false;
// Leap to a random spot on the page, kept on-screen and away from the pointer (px,py) so it doesn't jump under it.
function dodge(px, py) {
  const pad = 14, w = btn.offsetWidth, h = btn.offsetHeight;
  let x, y, tries = 0;
  do {
    x = pad + Math.random() * Math.max(0, innerWidth - w - pad * 2);
    y = pad + Math.random() * Math.max(0, innerHeight - h - pad * 2);
  } while (++tries < 12 && px != null && Math.hypot(x + w / 2 - px, y + h / 2 - py) < 260);
  btn.style.left = Math.round(x) + "px"; btn.style.top = Math.round(y) + "px";
}
// The button stays visible, floating free, and the game runs until the right password gets in (press Enter to submit).
function tease() {
  lbl.textContent = "Enter the correct password";
  if (!chase || teasing) return;
  teasing = true;
  const r = btn.getBoundingClientRect(); // start where it already is, then it will flee the pointer
  card.classList.add("tease");
  btn.style.left = Math.round(r.left) + "px"; btn.style.top = Math.round(r.top) + "px";
}
// Flee whenever the pointer comes within NEAR px of the floating button (distance to its nearest edge).
addEventListener("pointermove", e => {
  if (!teasing) return;
  const r = btn.getBoundingClientRect();
  const dx = e.clientX - Math.max(r.left, Math.min(e.clientX, r.right));
  const dy = e.clientY - Math.max(r.top, Math.min(e.clientY, r.bottom));
  if (Math.hypot(dx, dy) < NEAR) dodge(e.clientX, e.clientY);
});
btn.addEventListener("pointerdown", e => { if (teasing) { e.preventDefault(); dodge(e.clientX, e.clientY); } });
addEventListener("resize", () => teasing && dodge());
// Validate as they type: the moment the fields look ready again, nudge them to press Enter.
const sayReady = () => { if (teasing) lbl.textContent = user.value.trim() && pw.value ? "Looks good — press Enter" : "Enter the correct password"; };
pw.addEventListener("input", sayReady);
user.addEventListener("input", sayReady);
document.getElementById("form").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  if (!user.value.trim() || !pw.value) { err.textContent = "Enter your username and password"; shake(); return; }
  btn.disabled = true; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: user.value.trim(), password: pw.value }) });
    if (r.ok) { location.href = "/"; return; }
    err.textContent = (await r.json().catch(() => ({}))).error || "Sign-in failed";
    tease();
  } catch { err.textContent = "Cannot reach the server"; }
  shake();
  btn.disabled = false;
};
</script>
</body>
</html>

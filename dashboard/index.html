<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Remote Management</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e6eeff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Theme: html[data-theme] is set before paint by the head script (auto follows the system). */
  :root {
    --bg: #eceffa; --bg-grad: linear-gradient(135deg, #e6eeff 0%, #f1e8ff 50%, #ffeadb 100%);
    --card: rgba(255,255,255,.55); --sheen: rgba(255,255,255,.45); --edge: rgba(255,255,255,.75); --solid: #ffffff; --th: rgba(255,255,255,.72);
    --dlg: rgba(255,255,255,.8); --btn: rgba(255,255,255,.6); --btn-hover: rgba(255,255,255,.88);
    --text: #1d2129; --muted: #5b6472; --line: rgba(29,33,41,.08); --hover: rgba(255,255,255,.5);
    --glass: rgba(255,255,255,.5); --accent: #f28c00; --accent2: #ffb340; --accent-soft: rgba(242,140,0,.12); --accent-ink: #ffffff;
    --ok: #1f9d55; --ok-soft: rgba(31,157,85,.12); --bad: #e5383b; --bad-soft: rgba(229,56,59,.11); --warn: #b26a00; --warn-soft: rgba(255,179,64,.18);
    --shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 1px 2px rgba(31,38,90,.04), 0 10px 32px rgba(31,38,90,.08);
    --shadow-hi: inset 0 1px 0 rgba(255,255,255,.9), 0 2px 4px rgba(31,38,90,.05), 0 20px 50px rgba(31,38,90,.15);
    --glow1: rgba(242,140,0,.2); --glow2: rgba(64,120,255,.22); --glow3: rgba(190,110,255,.18);
    --ease: cubic-bezier(.2,.8,.2,1); color-scheme: light;
  }
  /* dark: Apple's neutral greys (system background #000, grouped #1c1c1e, elevated #2c2c2e), no coloured tint */
  :root[data-theme="dark"] {
    --bg: #000000; --bg-grad: #000000;
    --card: #1c1c1e; --sheen: rgba(255,255,255,.04); --edge: rgba(255,255,255,.08); --solid: #1c1c1e; --th: rgba(28,28,30,.92);
    --dlg: rgba(36,36,38,.92); --btn: #2c2c2e; --btn-hover: #3a3a3c;
    --text: #f5f5f7; --muted: #98989d; --line: rgba(84,84,88,.4); --hover: rgba(255,255,255,.05);
    --glass: rgba(28,28,30,.72); --accent-soft: rgba(242,140,0,.16);
    --ok: #30d158; --ok-soft: rgba(48,209,88,.15); --bad: #ff453a; --bad-soft: rgba(255,69,58,.15); --warn: #ffd60a; --warn-soft: rgba(255,214,10,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    --shadow-hi: 0 0 0 1px rgba(255,255,255,.1), 0 12px 32px rgba(0,0,0,.6);
    --glow1: transparent; --glow2: transparent; --glow3: transparent; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; font: 14px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -.01em; background: var(--bg); color: var(--text); transition: background .4s var(--ease), color .4s var(--ease); }
  /* slow-drifting light behind the glass */
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(40% 35% at 20% 15%, var(--glow1), transparent 70%), radial-gradient(35% 30% at 85% 80%, var(--glow2), transparent 70%),
      radial-gradient(30% 30% at 75% 15%, var(--glow3), transparent 70%), var(--bg-grad);
    animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, -3%, 0) scale(1.08); } }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 10px; padding: 10px 22px;
    background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
    border-bottom: 1px solid var(--edge); box-shadow: 0 1px 0 var(--line); }
  header img { width: 38px; height: 38px; object-fit: contain; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgba(242,140,0,.25); }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--text), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 2s var(--ease) infinite; }
  .live.down i { background: var(--bad); animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 80%, 100% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } }
  .bell { position: relative; }
  .bell b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; animation: pop .4s var(--ease); }

  .layout { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: calc(100vh - 59px); }
  nav { position: sticky; top: 59px; align-self: start; height: calc(100vh - 59px); overflow-y: auto; padding: 16px 10px;
    background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px); border-right: 1px solid var(--edge); }
  nav a { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin-bottom: 2px; border-radius: 10px;
    color: var(--text); text-decoration: none; font-weight: 500; transition: background .2s, color .2s, transform .2s var(--ease); }
  nav a:hover { background: var(--hover); transform: translateX(2px); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px;
    background: linear-gradient(var(--accent), var(--accent2)); box-shadow: 0 0 12px var(--accent); }
  nav a .c { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav a .c.bad { color: #fff; background: var(--bad); padding: 0 7px; border-radius: 10px; font-weight: 700; }
  main { padding: 28px 32px 96px; max-width: 1500px; width: 100%; min-width: 0; display: flex; flex-direction: column; } /* bottom room for the Max button */
  main > footer { margin-top: auto; } /* copyright line always at the bottom of the page */
  main h2 { margin: 0 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
  main .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    nav { position: sticky; top: 59px; z-index: 900; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--edge); padding: 6px; gap: 2px; }
    nav a { white-space: nowrap; padding: 7px 11px; margin: 0; } nav a .c, nav a.on::before { display: none; } nav a:hover { transform: none; }
    main { padding: 18px 16px; } main h2 { font-size: 24px; } header { padding: 10px 16px; gap: 8px; } header .sub, #liveText { display: none; }
    header .btn { padding: 6px 10px; }
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { position: relative; overflow: hidden; background: linear-gradient(180deg, var(--sheen), transparent 70%), var(--card);
    backdrop-filter: saturate(170%) blur(24px); -webkit-backdrop-filter: saturate(170%) blur(24px); border: 1px solid var(--edge); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--shadow);
    text-align: left; text-decoration: none; color: inherit; display: block; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; }
  .stat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.12) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform .8s var(--ease); pointer-events: none; }
  a.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-hi); border-color: rgba(242,140,0,.35); }
  a.stat:hover::after { transform: translateX(100%); }
  .stat .n { font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
  .stat.ok .n { color: var(--ok); } .stat.bad .n { color: var(--bad); } .stat.warn .n { color: var(--warn); }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 18px; }
  .card { background: linear-gradient(180deg, var(--sheen), transparent 140px), var(--card); backdrop-filter: saturate(170%) blur(24px);
    -webkit-backdrop-filter: saturate(170%) blur(24px); border: 1px solid var(--edge); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; transition: box-shadow .35s var(--ease), border-color .35s; }
  .card:hover { box-shadow: var(--shadow-hi); }
  .card > h3 { margin: 0; padding: 14px 18px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card > h3 .grow { flex: 1; }
  .pad { padding: 18px; }
  .toolbar { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--hover); transition: border-color .2s, box-shadow .2s, background .2s; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--solid); }
  select option { background: var(--solid); color: var(--text); }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--th); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: var(--muted); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .2s; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--hover); }
  tbody tr.sel { background: var(--accent-soft); }
  td.wrap { white-space: normal; }
  td .row { flex-wrap: nowrap; }
  @media (max-width: 480px) { header h1 { display: none; } }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .type { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600;
    background: var(--hover); color: var(--muted); vertical-align: 1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.neutral { color: var(--muted); background: var(--hover); }
  /* Sites page: one card per site */
  .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; margin-top: 14px; }
  .site-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .site-card a { color: inherit; text-decoration: none; }
  .site-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .site-head .name { font-size: 16px; font-weight: 650; }
  .site-logo { width: 40px; height: 40px; flex: none; border-radius: 10px; object-fit: contain; background: var(--btn); border: 1px solid var(--line);
    display: inline-grid; place-items: center; font-weight: 700; font-size: 17px; color: var(--accent); }
  .site-logo.big { width: 52px; height: 52px; font-size: 22px; border-radius: 13px; }
  .site-health { display: flex; align-items: center; gap: 10px; }
  .site-health > b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .site-health .meter { flex: 1; } .site-health .meter .bar { width: 100%; }
  .site-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .site-stats div { background: var(--hover); border-radius: 10px; padding: 8px; text-align: center; }
  .site-stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .site-stats span { font-size: 12px; color: var(--muted); }
  .site-stats .bad b { color: var(--bad); } .site-stats .warn b { color: var(--warn); }
  .stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .health-list { display: grid; gap: 14px; } .health-list .hbar { margin: 6px 0 4px; }
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 14px 18px 18px; }
  .gauge { text-align: center; } .gauge svg { width: 100%; max-width: 170px; display: block; margin: 0 auto 4px; color: var(--text); }
  .gauge .l { font-weight: 600; font-size: 13px; } .gauge .meta { font-size: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  .cd-grid { display: grid; grid-template-columns: minmax(170px, 1fr) 1.6fr; gap: 12px; width: min(680px, 82vw); margin: 10px 0 4px; }
  @media (max-width: 600px) { .cd-grid { grid-template-columns: 1fr; width: auto; } }
  .cd-list { border: 1px solid var(--line); border-radius: 12px; padding: 5px; max-height: 48vh; overflow: auto; }
  .cd-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; cursor: pointer; }
  .cd-row:hover { background: var(--hover); } .cd-row.on { background: var(--accent-soft); } .cd-row .grow { flex: 1; min-width: 0; }
  .meter { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; font-size: 13px; }
  .meter .bar { width: 38px; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter .bar b { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ok), #6ee7b7); }
  .meter.warn .bar b { background: linear-gradient(90deg, var(--warn), var(--accent2)); } .meter.bad .bar b { background: linear-gradient(90deg, var(--bad), #ff9a9a); }
  .btn { padding: 7px 14px; border-radius: 980px; border: 1px solid var(--edge); background: var(--btn); box-shadow: inset 0 1px 0 var(--sheen), 0 1px 3px rgba(31,38,90,.06);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: transform .2s var(--ease), background .2s, box-shadow .25s var(--ease), border-color .2s; }
  a.btn { color: inherit; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--btn-hover); border-color: var(--edge); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--accent-ink); font-weight: 600;
    box-shadow: 0 4px 14px rgba(242,140,0,.3); }
  .btn.primary:hover { box-shadow: 0 6px 22px rgba(242,140,0,.45); transform: translateY(-1px); }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
  form.grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  form.grid label { color: var(--muted); }
  @media (max-width: 600px) { form.grid { grid-template-columns: 1fr; } }
  .days label { margin-right: 8px; white-space: nowrap; color: var(--text) !important; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; font-weight: 500; }
  /* health chart (Grafana style): filled lines, axes, legend table on the right, hover crosshair */
  .hchart { display: flex; gap: 8px; padding: 10px 14px 12px; position: relative; }
  .hchart .plot { flex: 1; min-width: 0; position: relative; }
  .hchart svg { display: block; width: 100%; }
  .hchart .ax { font-size: 10.5px; fill: var(--muted); }
  .hchart .tip { position: absolute; top: 4px; pointer-events: none; background: var(--dlg); border: 1px solid var(--edge); border-radius: 10px;
    padding: 7px 10px; font-size: 12px; box-shadow: var(--shadow-hi); white-space: nowrap; z-index: 2; backdrop-filter: blur(20px); }
  .hchart .tip i, .hlegend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .hlegend { width: 250px; flex: none; font-size: 12px; border-collapse: collapse; align-self: flex-start; }
  .hlegend th { color: var(--muted); font-weight: 500; text-align: right; padding: 3px 6px; }
  .hlegend th:first-child { text-align: left; }
  .hlegend td { padding: 4px 6px; text-align: right; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
  .hlegend td:first-child { text-align: left; white-space: nowrap; }
  .hlegend tr[data-s] { cursor: pointer; }
  .hlegend tr[data-s]:hover td { background: var(--hover); }
  .hlegend tr.off { opacity: .4; }
  @media (max-width: 760px) { .hchart { flex-direction: column; } .hlegend { width: 100%; } }
  ol.cmds { margin: 0 0 10px; padding-left: 22px; display: grid; gap: 8px; }
  ol.cmds li::marker { color: var(--muted); font-size: 12px; }
  ol.cmds .row { gap: 8px; align-items: flex-start; }
  ol.cmds code { flex: 1; font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--btn); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; word-break: break-all; }
  ol.cmds .btn { padding: 4px 10px; font-size: 12px; }
  ol.cmds .meta { font-size: 12px; margin-top: 2px; }
  details.steps > summary { cursor: pointer; list-style: none; font-weight: 600; padding: 10px 0; color: var(--accent); }
  details.steps > summary::-webkit-details-marker { display: none; }
  details.steps > summary::before { content: "▸"; display: inline-block; margin-right: 8px; transition: transform .2s var(--ease); }
  details.steps[open] > summary::before { transform: rotate(90deg); }
  .card > h3 .tabs.hr { margin: 0; padding: 0; gap: 4px; }
  .card > h3 .tabs.hr .btn { padding: 4px 10px; font-size: 12px; }
  #view.enter .hchart .ln { stroke-dasharray: 4000; animation: draw 1.6s var(--ease); }
  @keyframes draw { from { stroke-dashoffset: 3000; } }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 18px 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  pre.log { margin: 0; padding: 14px 18px; max-height: 480px; overflow: auto; font: 12px/1.6 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; }
  .qr svg { display: block; width: 280px; height: 280px; }
  .code { font: 700 13px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .08em; padding: 4px 8px; border-radius: 7px;
    background: var(--accent-soft); color: var(--accent); }
  tr.pending td { color: var(--muted); }
  .bigcode { font: 700 54px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .15em; text-align: center; color: var(--accent);
    background: var(--accent-soft); border-radius: 16px; padding: 18px; margin: 10px 0; }
  .donut-wrap { display: flex; align-items: center; gap: 28px; padding: 20px; flex-wrap: wrap; }
  .donut { width: 180px; height: 180px; flex: none; }
  .donut text { fill: var(--text); }
  .donut circle + circle { filter: drop-shadow(0 0 4px var(--ok-soft)); }
  .legend2 { display: grid; gap: 10px; font-size: 14px; }
  .legend2 i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
  .hbar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--line); min-width: 120px; }

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
  return data;
}

  catch (e) { toast("Failed: " + e.message, true); }
  await refresh();
};

// ---------------- data + routing ----------------
async function refresh() {
  try {
    const r = await api("/api/state");
    skew = r.now - Date.now();
    r.devices.sort((a, b) => label(a).localeCompare(label(b)));
    S = r;
    $("live").classList.remove("down");
    $("liveText").textContent = "Live · " + new Date().toLocaleTimeString();
  } catch (e) {
    $("live").classList.add("down");
    $("liveText").textContent = "Server unreachable";
    return;
  }
  for (const id of picked) if (!dev(id)) picked.delete(id);
  const n = openAlerts().length;
  $("bellN").hidden = !n;
  $("bellN").textContent = n;
  $("who").innerHTML = S.me ? `${ico("user-round")}<span class="t">${esc(S.me.name || S.me.username)}</span>${S.me.readOnly ? `<span class="pill neutral">View only</span>` : ""}` : "";

  renderAlarm();
  watchAutoTickets();
  renderMaint();
  $("maxBtn").hidden = !S.assistant?.allowed || !$("maxPanel").hidden;
  if ($("maxBot")) $("maxBot").hidden = !S.assistant?.allowed;
  route(true);
  if ($("mapDlg").open) drawMap();
}

    const step = t => { const p = Math.min(1, (t - t0) / 700); n.textContent = Math.round(end * (1 - (1 - p) ** 3)); if (p < 1 && n.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}

  const health = list.length ? Math.round(1000 * on / list.length) / 10 : null;
  const status = health == null ? ["neutral", "No devices"] : health < 50 ? ["bad", "Critical"] : health < 90 || alerts ? ["warn", "Attention"] : ["ok", "Healthy"];
  return { list, n, on, off: list.length - on, alerts, health, status };

// Ring with one segment per fleet state (n = { online, warning, offline, maintenance }).
function donut(n, total) {
  const r = 70, c = 2 * Math.PI * r, pct = v => total ? Math.round(1000 * v / total) / 10 : 0;
  let start = 0;
  const segs = FLEET.filter(([k]) => n[k]).map(([k, , col]) => {
    const len = c * n[k] / total, s = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${css(col)}" stroke-width="22"
      stroke-dasharray="${len} ${c}" stroke-dashoffset="${-start}" transform="rotate(-90 90 90)"/>`;
    start += len;
    return s;
  });
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="${r}" fill="none" stroke="${css("--line")}" stroke-width="22"/>${segs.join("")}
      <text x="90" y="88" text-anchor="middle" font-size="34" font-weight="700">${Math.round(pct(n.online + n.warning))}%</text>
      <text x="90" y="112" text-anchor="middle" font-size="13" opacity=".65">online</text></svg>
    <div class="legend2">${FLEET.map(([k, name, col]) => `<div><i style="background:${css(col)}"></i><b>${n[k]}</b> ${name} <span class="meta">(${pct(n[k])}%)</span></div>`).join("")}
      <div class="meta">${total} devices in total</div></div></div>`;
}

}

function rowClick(e) {
  const un = e.target.closest("[data-unpend]");
  if (un) { if (confirm(`Cancel Device ID ${un.dataset.unpend}?`)) act(() => api("/api/devices/pending/delete", { code: un.dataset.unpend }), "Cancelled"); return; }
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  const d = dev(tr.dataset.id);
  if (e.target.closest("[data-pick]")) { e.target.checked ? picked.add(d.id) : picked.delete(d.id); route(true); return; }
  const cmd = e.target.closest("[data-cmd]"), menu = e.target.closest("[data-menu]");
  if (cmd) return command([d], cmd.dataset.cmd);
  if (menu) { e.stopPropagation(); return deviceMenu(menu, d); }
  location.hash = "#/device/" + encodeURIComponent(d.id);
}

function deviceAction(d, a) {
  if (a === "open") location.hash = "#/device/" + encodeURIComponent(d.id);
  if (a === "map") openMap(d);
  if (a === "logs") api(`/api/devices/${d.id}/logs`).then(text => {
    const link = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: `${d.code || d.id}-logs.txt` });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  }).catch(() => toast(`No logs from ${label(d)} yet. Use "Get logs" first.`, true));
  if (a === "rename") {
    const name = prompt("Device name (e.g. site + location):", label(d));
    if (name && name.trim()) act(() => api(`/api/devices/${d.id}/name`, { name }), "Renamed");
  }

// Sends one command to a list of devices. install / file ask which app / file first.
// Screenshot popup. t0 = server time the request was sent; null = just show the last screenshot.
let shotTimers = [];
async function screenshot(d, send = true) {
  const dl = $("shotDlg"), t0 = send ? now() : null;
  shotTimers.forEach(clearInterval);
  shotTimers = [];
  dl.onclose = () => { shotTimers.forEach(clearInterval); shotTimers = []; };
  dl.onclick = e => {
    const b = e.target.closest("[data-shot]");
    if (b?.dataset.shot === "again") screenshot(dev(d.id) || d);
    if (b?.dataset.shot === "close") dl.close();
  };
  let sendError = "", shown = "";
  const render = () => {
    const x = dev(d.id) || d, secs = t0 ? Math.round((now() - t0) / 1000) : 0;
    const again = `<button class="btn primary" data-shot="again">📸 ${t0 ? "Try again" : "Take new screenshot"}</button>`;
    let state, body;
    if (t0 == null || x.screenshotAt > t0) {
      const at = x.screenshotAt, src = `/api/devices/${encodeURIComponent(x.id)}/screenshot.jpg?t=${at}`;
      const file = `${x.code || x.id}-${new Date(at - new Date(at).getTimezoneOffset() * 6e4).toISOString().slice(0, 19).replace(/\D/g, "")}.jpg`;
      state = "img" + at;
      body = at ? `<a href="${src}" target="_blank" rel="noopener"><img class="shot" src="${src}" alt="Screenshot of ${esc(label(x))}"></a>
        <p class="meta" style="text-align:center">${new Date(at).toLocaleString()}${t0 ? ` · took ${Math.max(1, Math.round((at - t0) / 1000))} s` : ` · ${ago(at)}`}</p>
        <div class="foot">${again.replace("Try again", "Take again")}<a class="btn" href="${src}" download="${esc(file)}">Download</a>
          <a class="btn" href="${src}" target="_blank" rel="noopener">Open full size</a><button class="btn" data-shot="close">Close</button></div>`
        : `<p class="empty">No screenshot yet.</p><div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else if (sendError || x.screenshotError?.at > t0) {
      state = "err";
      body = `<div class="shot-msg"><div style="font-size:40px">⚠️</div><b>Couldn't take the screenshot</b>
        <p class="meta">${esc(sendError || x.screenshotError.text)}</p></div><div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else if (secs >= 60) {
      state = "timeout";
      body = `<div class="shot-msg"><div style="font-size:40px">⏳</div><b>No screenshot after a minute</b>
        <p class="meta">${isOnline(x) ? `${esc(label(x))} may be busy, or someone needs to tap <b>Start now</b> on its screen the first time.`
          : `${esc(label(x))} is offline. The request stays queued and runs when it reconnects.`}</p></div>
        <div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else {
      state = "wait";
      body = `<div class="shot-msg"><div class="spin"></div><b>Waiting for ${esc(label(x))}… ${secs} s</b>
        <p class="meta">${isOnline(x) ? "Usually 3–20 seconds. The first time on older Android, someone may need to tap <b>Start now</b> on the device."
          : `⚠️ ${esc(label(x))} is offline (last seen ${ago(x.lastSeen)}). The request is queued and runs when it reconnects.`}</p></div>
        <div class="foot"><button class="btn" data-shot="close">Close</button></div>`;
    }
    if (state === shown && state !== "wait") return;
    shown = state;
    dl.innerHTML = `<h2>📸 ${esc(label(x))} <span class="code">${esc(x.code || "")}</span></h2>${body}`;
    if (state !== "wait") { shotTimers.forEach(clearInterval); shotTimers = []; }
  };
  render();
  if (!dl.open) dl.showModal();
  if (!t0) return;
  shotTimers = [setInterval(render, 1000), setInterval(() => refresh().then(render), 1500)];
  try { await api(`/api/devices/${d.id}/command`, { type: "screenshot" }); }
  catch (e) { sendError = e.message; render(); }
}

// Live remote control (Android): the device streams its screen while this window is open and stops ~20 s after it
// closes. Click = tap, drag = swipe. About 1 picture a second on Android 11-13, 3 on 14+; taps go through at once.
async function liveView(d) {
  const dl = $("shotDlg"), base = `/api/devices/${encodeURIComponent(d.id)}/live`;
  shotTimers.forEach(clearInterval);
  shotTimers = [];
  let open = true, down = null;
  dl.innerHTML = `<h2>🖥 ${esc(label(d))} <span class="code">${esc(d.code || "")}</span></h2>
    <div class="shot-msg" id="liveWait"><div class="spin"></div><b>Connecting…</b>
      <p class="meta">${isOnline(d) ? "The device picks this up on its next check-in, usually within 10 seconds." : `⚠️ ${esc(label(d))} is offline (last seen ${ago(d.lastSeen)}).`}</p></div>
    <img class="shot" id="liveImg" alt="Live screen of ${esc(label(d))}" hidden draggable="false" style="cursor:pointer;touch-action:none;user-select:none">
    <div class="live-side">${[["unlock", "🔓 Unlock 2 min"], ["lock", "🔒 Lock"], ["singleapp", "📌 Pin app…"], ["unpin", "Unpin app"]]
      .filter(([c]) => withUnpin(S.commands[d.type] || []).includes(c)).map(([c, t]) => `<button class="btn" data-c="${c}">${t}</button>`).join("")}</div>
    <div class="foot"><button class="btn" data-k="back">◀ Back</button><button class="btn" data-k="home">● Home</button><button class="btn" data-k="recents">▢ Recents</button>
      <span class="grow"></span><span class="meta" id="liveAt"></span><button class="btn" data-k="close">Close</button></div>`;
  dl.classList.add("live");
  dl.onclose = () => { open = false; dl.classList.remove("live"); };
  const send = b => api(base, b).catch(e => toast(e.message, true));
  dl.onclick = e => {
    const k = e.target.closest("[data-k]")?.dataset.k, c = e.target.closest("[data-c]")?.dataset.c;
    if (c) return command([dev(d.id) || d], c); // kiosk commands: same as the device page (unlock re-locks itself after 2 min)
    if (k === "close") dl.close(); else if (k) send({ a: k });
  };
  const img = $("liveImg"), at = e => { const r = img.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
  img.onpointerdown = e => { e.preventDefault(); down = at(e); img.setPointerCapture(e.pointerId); };
  img.onpointerup = e => {
    if (!down) return;
    const u = at(e), r = img.getBoundingClientRect(), far = Math.hypot((u.x - down.x) * r.width, (u.y - down.y) * r.height) > 12;
    send(far ? { a: "swipe", x: down.x, y: down.y, x2: u.x, y2: u.y } : { a: "tap", ...down });
    down = null;
  };
  // Scale the picture (up, too) to the largest size that fits the window, keeping its shape so clicks land right.
  const fit = () => {
    if (!img.naturalWidth) return;
    const k = Math.min((dl.clientWidth - 40 - 2 * dl.querySelector(".live-side").offsetWidth) / img.naturalWidth, (innerHeight - 150) / img.naturalHeight); // centred, clear of the side buttons
    img.style.width = Math.floor(img.naturalWidth * k) + "px";
    img.style.height = Math.floor(img.naturalHeight * k) + "px";
  };
  addEventListener("resize", fit);
  dl.addEventListener("close", () => removeEventListener("resize", fit), { once: true });
  if (!dl.open) dl.showModal();
  try { await api(`/api/devices/${d.id}/command`, { type: "live" }); } catch (e) { toast(e.message, true); return dl.close(); }
  // Each request waits on the server for a picture newer than the last, so it shows the moment it arrives.
  let lastAt = 0, shown = "";
  while (open) {
    try {
      const r = await fetch(`${base}.jpg?after=${lastAt}`);
      if (r.status === 401) { location.href = "/login"; break; }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
      const at = Number(r.headers.get("x-frame-at")) || 0, lag = Math.round((Number(r.headers.get("x-now")) - at) / 1000);
      if (r.status === 200) {
        lastAt = at;
        const next = URL.createObjectURL(await r.blob());
        await new Promise(ok => { img.onload = img.onerror = ok; img.src = next; });
        if (shown) URL.revokeObjectURL(shown);
        shown = next;
        img.hidden = false;
        $("liveWait").hidden = true;
        fit();
      }
      $("liveAt").textContent = !at ? "" : lag < 5 ? "● Live" : `No new picture for ${lag} s`;
    } catch (e) { if (open) { toast(e.message, true); dl.close(); } break; }
  }
  if (shown) URL.revokeObjectURL(shown);
}

// target: same shape as /api/bulk ({ids} | {all:true} ...); n = how many devices, for the confirm text.
function maintenance(target, on, n) {
  if (on && n > 1 && !confirm(`Show the maintenance screen on ${n} devices?`)) return;
  return act(() => api("/api/maintenance", { target, on }), r => `Maintenance ${on ? "on" : "off"} for ${r.count} device${r.count === 1 ? "" : "s"}`);
}
function renderMaint() {
  const n = S.devices.filter(d => d.maintenance).length;
  $("maintBar").innerHTML = n ? `<div class="alarm maint">🛠<span class="grow">${n} device${n > 1 ? "s" : ""} in maintenance (showing the System Maintenance screen)</span>
    <a class="btn" href="#/devices" id="maintShow">Show</a><button class="btn" id="maintOff">Turn all off</button></div>` : "";
  if (!n) return;
  $("maintShow").onclick = () => { filters = { q: "", type: "", group: "", status: "maintenance" }; route(false); };
  $("maintOff").onclick = () => maintenance({ all: true }, false);
}

async function command(list, type, extra = {}) {
  if (type === "maintOn" || type === "maintOff") return maintenance({ ids: list.map(d => d.id) }, type === "maintOn", list.length);
  if (type === "screenshot" && list.length === 1) return screenshot(list[0]);
  if (type === "live") return list.length === 1 ? liveView(list[0]) : toast("Remote control works on one device at a time", true);
  if (type === "install" && !extra.appId) return pickUpload("apps", list, type);
  if (type === "file" && !extra.fileId) return pickUpload("files", list, type);
  if (type === "singleapp" && extra.package === undefined) return pickSingleApp(list);
  if (type === "unpin") return command(list, "singleapp", { package: "", appName: "unpin" });
  if (type === "message" && extra.text === undefined) return dialog(`<h2>Show message</h2>
    <p class="meta">Pops up on the screen of ${list.length === 1 ? esc(label(list[0])) : list.length + " devices"} for the signed-in user.</p>
    <textarea id="msgText" rows="4" maxlength="500" style="width:100%" required placeholder="e.g. Please save your work, this PC restarts in 10 minutes."></textarea>`,
    "Show", () => command(list, "message", { text: $("msgText").value }));
  if (type === "run" && extra.script === undefined) return dialog(`<h2>Run command</h2>
    <p class="meta">PowerShell, run as administrator (SYSTEM) on ${list.length === 1 ? esc(label(list[0])) : list.length + " devices"}. The output shows on the device page. Admins only.</p>
    <textarea id="runText" rows="6" maxlength="8000" style="width:100%;font-family:ui-monospace,Consolas,monospace" required placeholder="e.g. Get-Service | Where-Object Status -eq Running | Select-Object -First 20"></textarea>`,
    "Run", () => command(list, "run", { script: $("runText").value }));
  const names = list.length === 1 ? label(list[0]) : list.length + " devices";
  const what = type === "singleapp" && extra.package === "" ? "Unpin app" : CMD[type].replace("…", "");
  if (type === "reboot" && !confirm(`Restart ${names}?`)) return;
  if (type === "shutdown" && !confirm(`Shut down ${names}? Someone has to switch ${list.length === 1 ? "it" : "them"} on again.`)) return;
  if (type === "logoff" && !confirm(`Log off the user on ${names}? Unsaved work is lost.`)) return;
  if (list.length === 1 && !isOnline(list[0]) && !confirm(`${names} is offline. Send anyway? It runs when the device reconnects.`)) return;
  if (list.length > 1 && !confirm(`Send "${what}" to ${names}?`)) return;
  await act(() => list.length === 1
      ? api(`/api/devices/${list[0].id}/command`, { type, ...extra })
      : api("/api/bulk", { target: { ids: list.map(d => d.id) }, action: "command", type, ...extra }),
    r => `${what} sent to ${r.count ?? 1} device${(r.count ?? 1) === 1 ? "" : "s"}`);
}

// Newest kiosk app on Apps & files: highest version in the label ("Kiosk app v10.20"), else the one used for QR enrollment.
const verOf = s => (/\d+(\.\d+)*/.exec(s || "") || [])[0];
const cmpVer = (a, b) => { const x = a.split(".").map(Number), y = b.split(".").map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); return 0; };
function latestKioskApp() {

// Apps installed on all the chosen devices (each device reports its own list).
function pickSingleApp(list) {
  const sets = list.map(d => new Map(d.launcherApps || []));
  const common = [...(sets[0] || new Map())].filter(([pkg]) => sets.every(m => m.has(pkg)));
  if (!common.length) return toast(list.length > 1 ? "These devices have no app in common" : "This device hasn't reported its apps yet (update the kiosk app)", true);
  const cur = list.length === 1 ? list[0].singleApp || "" : "";

  dialog(`<h2>App pinning</h2>

    api(`/api/devices/${d.id}/history`).catch(() => ({ history: [] })),
    api(`/api/events?device=${encodeURIComponent(d.id)}`).catch(() => ({ events: [] })),
    api(`/api/devices/${d.id}/logs`).catch(e => "No logs yet. Click \"Request new logs\"; they arrive within a few seconds when the device is online."),
  ]);
  if (!location.hash.startsWith("#/device/")) return;
  healthChart($("dChart"), hist);
  $("dEvents").innerHTML = ev.events.slice(0, 100).map(eventRow).join("") || `<tr><td class="empty">Nothing yet</td></tr>`;
  const pre = $("dLogs"), atEnd = pre.scrollTop + pre.clientHeight >= pre.scrollHeight - 10;
  const text = (d.logsAt ? `Uploaded ${when(d.logsAt)}\n\n` : "") + logs; // a fixed time, so the text only changes with new logs
  if (pre.textContent !== text) { pre.textContent = text; if (atEnd || first) pre.scrollTop = pre.scrollHeight; }
};

// Half-ring gauge (Grafana style) for the device page: v in % (or °C on a 0-100 scale); colour by warn/bad level.
function gauge(name, v, warnAt, badAt, unit, sub) {
  const col = v == null ? "--line" : v >= badAt ? "--bad" : v >= warnAt ? "--warn" : "--ok", p = Math.min(100, Math.max(0, v ?? 0));
  return `<div class="gauge"><svg viewBox="0 0 120 70"><path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="${css("--line")}" stroke-width="11" stroke-linecap="round"/>
    ${v == null ? "" : `<path d="M10 62 A50 50 0 0 1 110 62" fill="none" stroke="${css(col)}" stroke-width="11" stroke-linecap="round" pathLength="100" stroke-dasharray="${p} 100"/>`}
    <text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="currentColor">${v == null ? "–" : Math.round(v * 10) / 10 + unit}</text></svg>
    <div class="l">${esc(name)}</div><div class="meta">${esc(sub || "")}</div></div>`;
}

// Health chart (Grafana style). Rows: [time, battery, cpu, ram, disk, temp]; the server keeps 24 h of 5-minute points
// and a month of hourly averages, so week / month use the hourly ones plus the latest 5-minute points.
const HEALTH_SERIES = [["CPU", 2, "#fade2a", "%"], ["Memory", 3, "#5794f2", "%"], ["Battery", 1, "#73bf69", "%"], ["Storage", 4, "#ff9830", "%"], ["Temperature", 5, "#f2495c", "°C"]];
const HEALTH_RANGES = [["24h", "Last 24 h"], ["today", "Today"], ["week", "This week"], ["month", "This month"]];
let healthRange = "24h", healthOnly = null; // healthOnly: the one series picked in the legend, or all
try { healthRange = localStorage.getItem("healthRange") || "24h"; } catch {}
function healthChart(el, hist) {
  $("dRange").innerHTML = HEALTH_RANGES.map(([k, t]) => `<button class="btn ${k === healthRange ? "primary" : "ghost"}" data-r="${k}">${t}</button>`).join("");
  $("dRange").onclick = e => {
    const r = e.target.closest("[data-r]")?.dataset.r;
    if (!r) return;
    healthRange = r;
    try { localStorage.setItem("healthRange", r); } catch {}
    el.dataset.key = "";
    healthChart(el, hist);
  };
  const now = Date.now(), day = new Date(); day.setHours(0, 0, 0, 0);
  const t0 = { "24h": now - 864e5, today: +day, week: +day - ((day.getDay() + 6) % 7) * 864e5, month: +new Date(day.getFullYear(), day.getMonth(), 1) }[healthRange];
  const fine = (hist.history || []).filter(r => r[0] >= t0), hourly = (hist.hourly || []).filter(r => r[0] >= t0);
  const coarse = healthRange === "week" || healthRange === "month";
  const after = hourly.length ? hourly[hourly.length - 1][0] + 36e5 : 0;
  const h = coarse ? [...hourly, ...fine.filter(r => r[0] >= after)] : fine;
  // The device page redraws every few seconds: keep the chart (and a hover in progress) unless something changed.
  const key = [healthRange, healthOnly, h.length, h[h.length - 1]?.[0], el.clientWidth].join();
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  if (h.length < 2) return el.innerHTML = `<p class="empty" style="flex:1">${coarse && !hourly.length ? "Hourly history starts now: this view fills up over the coming hours and days."
    : "Collecting… a point is saved every 5 minutes."}</p>`;
  const all = HEALTH_SERIES.filter(([, i]) => h.some(r => r[i] != null));
  const series = all.filter(([n]) => !healthOnly || n === healthOnly).length ? all.filter(([n]) => !healthOnly || n === healthOnly) : all;
  const wide = el.clientWidth > 760, W = Math.max(300, el.clientWidth - 28 - (wide ? 258 : 0)), H = 230;
  // X: from the first recorded point (not midnight / Monday), so a short history fills the width.
  // Y: 0-100 for all series; one picked series gets a range fitted to its values.
  const L = 38, R = 8, T = 10, B = 24, ts = h[0][0], t1 = now;
  let lo = 0, hi = 100;
  if (series.length === 1) {
    const v = h.map(r => r[series[0][1]]).filter(x => x != null), mn = Math.min(...v), mx = Math.max(...v), pad = Math.max(2, (mx - mn) * 0.15);
    lo = Math.max(0, Math.floor(mn - pad)); hi = Math.ceil(mx + pad);
    if (series[0][3] === "%") hi = Math.min(100, hi);
  }
  const x = t => L + (W - L - R) * (t - ts) / Math.max(1, t1 - ts), y = v => T + (H - T - B) * (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo));
  // a gap longer than 3 points means the device was off: break the line there
  const gapMs = (coarse ? 36e5 : 3e5) * 3;
  const segs = i => {
    const out = [];
    let cur = [];
    for (const r of h) {
      if (r[i] == null) continue;
      if (cur.length && r[0] - cur[cur.length - 1][0] > gapMs) { out.push(cur); cur = []; }
      cur.push(r);
    }
    if (cur.length) out.push(cur);
    return out;
  };
  const f = n => n.toFixed(1);
  const paths = series.map(([n, i, c], k) => segs(i).map(sg => {
    const line = sg.map((r, j) => (j ? "L" : "M") + f(x(r[0])) + "," + f(y(r[i]))).join("");
    const area = line + `L${f(x(sg[sg.length - 1][0]))},${H - B}L${f(x(sg[0][0]))},${H - B}Z`;
    return `<path d="${area}" fill="url(#hg${k})" stroke="none"/><path class="ln" d="${line}" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"/>`;
  }).join("")).join("");
  // time axis: a step that leaves ~90 px between labels, on whole hours / local midnights
  const span = t1 - ts, steps = [0.25, 0.5, 1, 2, 3, 6, 12, 24, 48, 72, 168].map(s => s * 36e5);
  const step = steps.find(s => (W - L - R) * s / span >= 90) || steps[steps.length - 1];
  const ticks = [];
  const inc = Math.min(step, 36e5);
  for (let t = Math.ceil(ts / inc) * inc; t <= t1; t += inc) {
    const dt = new Date(t);
    if (step <= 36e5 || (step < 864e5 ? dt.getMinutes() === 0 && dt.getHours() % (step / 36e5) === 0
      : dt.getHours() === 0 && dt.getMinutes() === 0 && Math.round((t - t0) / 864e5) % (step / 864e5) === 0)) ticks.push(t);
  }
  const lab = t => step < 864e5 ? new Date(t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : new Date(t).toLocaleDateString([], healthRange === "month" ? { day: "numeric", month: "short" } : { weekday: "short", day: "numeric" });
  const stats = all.map(([n, i, c, u]) => {
    const v = h.map(r => r[i]).filter(x => x != null);
    return [n, c, u, v.reduce((a, b) => a + b, 0) / v.length, Math.max(...v), v[v.length - 1]];
  });
  const r1 = v => Math.round(v * 10) / 10;
  el.innerHTML = `<div class="plot"><svg viewBox="0 0 ${W} ${H}" height="${H}">
      <defs>${series.map(([, , c], k) => `<linearGradient id="hg${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".32"/><stop offset="1" stop-color="${c}" stop-opacity=".02"/></linearGradient>`).join("")}</defs>
      ${[0, 1, 2, 3, 4].map(k => lo + (hi - lo) * k / 4).map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}"/><text class="ax" x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${hi - lo < 20 ? r1(v) : Math.round(v)}${series.length === 1 ? series[0][3] : ""}</text>`).join("")}
      ${ticks.map(t => `<line x1="${f(x(t))}" x2="${f(x(t))}" y1="${T}" y2="${H - B}" stroke="${css("--line")}" stroke-dasharray="2 4"/><text class="ax" x="${f(x(t))}" y="${H - 7}" text-anchor="${x(t) > W - R - 30 ? "end" : x(t) < L + 30 ? "start" : "middle"}">${lab(t)}</text>`).join("")}
      ${paths}<g class="hover" visibility="hidden"><line y1="${T}" y2="${H - B}" stroke="${css("--muted")}" stroke-dasharray="3 3"/>${series.map(([, , c]) => `<circle r="3.5" fill="${c}" stroke="${css("--card")}" stroke-width="1.5"/>`).join("")}</g>
      <rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/></svg><div class="tip" hidden></div></div>
    <table class="hlegend"><tr><th title="Click a row to show only that one">Name</th><th>Mean</th><th>Max</th><th>Last</th></tr>
      ${stats.map(([n, c, u, mean, max, last]) => `<tr data-s="${n}" class="${series.length === 1 && series[0][0] !== n ? "off" : ""}"><td><i style="background:${c}"></i>${n}</td><td>${r1(mean)}${u}</td><td>${r1(max)}${u}</td><td><b>${r1(last)}${u}</b></td></tr>`).join("")}</table>`;
  el.querySelector(".hlegend").onclick = e => {
    const n = e.target.closest("[data-s]")?.dataset.s;
    if (!n) return;
    healthOnly = healthOnly === n ? null : n;
    el.dataset.key = "";
    healthChart(el, hist);
  };
  // hover: nearest point in time, values of every series at it
  const svg = el.querySelector("svg"), g = svg.querySelector(".hover"), tip = el.querySelector(".tip");
  svg.onpointermove = e => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) * W / b.width;
    if (px < L || px > W - R) return svg.onpointerleave();
    const t = ts + (px - L) / (W - L - R) * (t1 - ts);
    const r = h.reduce((a, c) => Math.abs(c[0] - t) < Math.abs(a[0] - t) ? c : a);
    const X = x(r[0]);
    g.setAttribute("visibility", "visible");
    g.querySelector("line").setAttribute("x1", X); g.querySelector("line").setAttribute("x2", X);
    series.forEach(([, i], k) => { const ci = g.querySelectorAll("circle")[k]; ci.setAttribute("cx", X); ci.setAttribute("cy", r[i] == null ? -10 : y(r[i])); });
    tip.innerHTML = `<b>${new Date(r[0]).toLocaleString([], { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</b>${coarse && hourly.includes(r) ? " · hourly average" : ""}<br>`
      + series.map(([n, i, c, u]) => `<i style="background:${c}"></i>${n} <b>${r[i] == null ? "–" : r1(r[i]) + u}</b>`).join("<br>");
    tip.hidden = false;
    const left = X * b.width / W;
    tip.style.left = (left > b.width / 2 ? left - tip.offsetWidth - 12 : left + 12) + "px";
  };
  svg.onpointerleave = () => { g.setAttribute("visibility", "hidden"); tip.hidden = true; };
}

  $("sLogo").onchange = () => {

      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      logo = c.toDataURL("image/webp", 0.9);
      if (!logo.startsWith("data:image/webp")) logo = c.toDataURL("image/png"); // Safari can't make WebP
      URL.revokeObjectURL(img.src);
      $("sLogoPrev").innerHTML = siteLogo({ logo }, true);
      $("sLogoDel").hidden = false;
    };
    img.onerror = () => toast("That file isn't an image", true);
    img.src = URL.createObjectURL(f);
  };
  $("sLogoDel").onclick = () => { logo = ""; $("sLogoPrev").innerHTML = siteLogo({}, true); $("sLogoDel").hidden = true; };
  $("sFind").onclick = () => geoSearch($("sAddr").value, $("sFound"), r => { $("sLat").value = r.lat; $("sLng").value = r.lng; if (!$("sAddr").value.trim()) $("sAddr").value = r.address; });

// OneMap address search through the server; shows the matches as chips and calls pick(result).
async function geoSearch(q, box, pick) {
  if ((q || "").trim().length < 3) return toast("Type the address or postal code first", true);
  box.innerHTML = `<span class="meta">Searching…</span>`;
  try {
    const { results } = await api("/api/geocode?q=" + encodeURIComponent(q.trim()));
    box.innerHTML = results.length ? results.map((r, i) => `<button type="button" class="chip" data-i="${i}">${esc(r.address)}</button>`).join("") : `<span class="meta">No match on OneMap; type the coordinates.</span>`;
    box.onclick = e => { const b = e.target.closest("[data-i]"); if (b) { pick(results[b.dataset.i]); box.innerHTML = `<span class="meta">✓ ${esc(results[b.dataset.i].address)}</span>`; } };
  } catch (e) { box.innerHTML = `<span class="meta">${esc(e.message)}</span>`; }
}

async function upload(kind, file, labelText, notes) {
  const q = new URLSearchParams({ kind, name: file.name, ...(labelText ? { label: labelText } : {}), ...(notes ? { notes } : {}) });
  // Cloud: the file goes straight to storage, then the server checks it. Office PC: start returns no link.
  const s = await api("/api/upload/start?" + q, {});
  if (s.uploadUrl) {
    const put = await fetch(s.uploadUrl, { method: "PUT", body: file });
    if (!put.ok) throw new Error("upload HTTP " + put.status);
    return api("/api/upload/finish?" + q, { id: s.id });
  }
  const r = await fetch("/api/upload?" + q, { method: "POST", body: file });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
  return r.json();
}

// Pick which devices get an app / file: sites on the left; pointing at one (or clicking / focusing it) lists its devices
// on the right to tick. The site box ticks its whole site. Starts with the devices ticked on the Devices page.
function chooseDevices(cmd, done) {
  const able = S.devices.filter(d => (S.commands[d.type] || []).includes(cmd));
  if (!able.length) return toast("No devices can do this yet", true);
  const sel = new Set(able.filter(d => picked.has(d.id)).map(d => d.id));
  const of = g => able.filter(d => (d.group || "") === g), sites = groups().filter(g => of(g).length);
  const verb = cmd === "install" ? "Install on" : "Send to", n = k => `${k} device${k === 1 ? "" : "s"}`;
  let cur = sites[0];
  dialog(`<h2>Choose devices</h2>
    <p class="meta">Point at a site to see its devices, then tick the ones you want. Only Android devices running the kiosk app can receive apps and files (${able.length} now).</p>
    <div class="cd-grid"><div class="cd-list" id="cdSites"></div><div class="cd-list" id="cdDevs"></div></div><p class="meta" id="cdN"></p>`,
    verb + " devices", () => { const list = able.filter(d => sel.has(d.id)); list.length ? done(list) : toast("Tick at least one device", true); });
  const ok = $("dlg").querySelector('button[value="ok"]');
  const render = () => {
    $("cdSites").innerHTML = `<label class="cd-row" data-site="__all"><input type="checkbox" ${sel.size === able.length ? "checked" : ""}><b class="grow">All sites</b><span class="meta">${able.length}</span></label>`
      + sites.map(g => {
        const k = of(g).filter(d => sel.has(d.id)).length, t = of(g).length;
        return `<label class="cd-row ${g === cur ? "on" : ""}" data-site="${esc(g)}"><input type="checkbox" ${k === t ? "checked" : ""} ${k && k < t ? "data-part" : ""}>
          <span class="grow">${esc(groupName(g))}</span><span class="meta">${k ? k + " / " : ""}${t}</span></label>`;
      }).join("");
    $("cdSites").querySelectorAll("[data-part]").forEach(i => (i.indeterminate = true));
    $("cdDevs").innerHTML = `<div class="meta" style="padding:4px 9px"><b>${esc(groupName(cur))}</b></div>` + of(cur).map(d => `<label class="cd-row">
      <input type="checkbox" data-dev="${esc(d.id)}" ${sel.has(d.id) ? "checked" : ""}><span class="code">${esc(d.code || "")}</span>
      <span class="grow">${esc(label(d))} <span class="meta">· ${esc(TYPES[d.type] || d.type)}</span></span>${statusPill(d)}</label>`).join("");
    $("cdN").textContent = n(sel.size) + " selected";
    ok.textContent = `${verb} ${n(sel.size)}`;
  };
  const show = e => { const g = e.target.closest("[data-site]")?.dataset.site; if (g != null && g !== "__all" && g !== cur) { cur = g; render(); } };
  $("cdSites").onmouseover = $("cdSites").onfocusin = show;

    const g = e.target.closest("[data-site]")?.dataset.site;
    if (g == null) return;

    for (const d of g === "__all" ? able : of(g)) e.target.checked ? sel.add(d.id) : sel.delete(d.id);
    if (g !== "__all") cur = g;
    render();
  };
  $("cdDevs").onchange = e => { const id = e.target.dataset.dev; if (id) { e.target.checked ? sel.add(id) : sel.delete(id); render(); } };
  render();
}

// Bug Finder: crashes and freezes of every app on every device, newest first.
const BUG_KINDS = { crash: ["Crash", "bad"], anr: ["Freeze (not responding)", "warn"], hang: ["Freeze (not responding)", "warn"],
  native: ["Native crash", "bad"], system: ["System crash", "bad"] };
let bugFilter = { q: "", site: "", kind: "", app: "" }, bugShown = [];
// One .txt for the given reports: a header (time, site, device, Device ID, app, problem) then the full log of each.
const bugFile = (list, name) => {
  const text = list.map(b => `==== ${new Date(b.at).toLocaleString()} · ${(BUG_KINDS[b.kind] || BUG_KINDS.crash)[0]} · ${b.app}\n`
    + `Site: ${groupName(dev(b.deviceId)?.group ?? b.site)}\nDevice: ${dev(b.deviceId) ? label(dev(b.deviceId)) : b.deviceName} (Device ID ${b.code || "–"}, ${b.deviceId})\n`
    + `Problem: ${b.summary}\n\n${b.text}\n`).join("\n");
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([text], { type: "text/plain" })), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

      <td>${d ? `<a href="#/device/${encodeURIComponent(b.deviceId)}">${esc(label(d))}</a>` : esc(b.deviceName)}<div class="meta">ID ${esc(b.code || "–")} · ${esc(b.deviceId)}</div></td>

};

      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d");
      g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height); // transparent PNGs get a black background
      g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => act(async () => {
        const r = await fetch("/api/config/maintenance-image", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: b });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
      }, "Maintenance image saved").then(() => VIEWS.config(null, true)), "image/jpeg", 0.85);
    };
    img.onerror = () => toast("That file isn't an image", true);
    img.src = URL.createObjectURL(f);
  };
  if ($("cfgImgReset")) $("cfgImgReset").onclick = () => act(async () => {
    const r = await fetch("/api/config/maintenance-image?reset=1", { method: "POST" });
    if (!r.ok) throw new Error("HTTP " + r.status);
  }, "Built-in maintenance image restored").then(() => VIEWS.config(null, true));
  // Relay rows: the detail fields only matter when the model has a relay.
  const sync = tr => tr.querySelectorAll("[data-f]:not([data-f=relay])").forEach(x => (x.disabled = tr.querySelector("[data-f=relay]").value !== "yes"));
  $("cfgRelay").querySelectorAll("tr").forEach(sync);
  $("cfgRelay").onchange = e => sync(e.target.closest("tr"));
  $("cfgRelay").onclick = e => {
    const tr = e.target.closest("tr"), m = tr?.dataset.m;
    if (!m) return;
    const v = f => tr.querySelector(`[data-f=${f}]`);
    if (e.target.closest("[data-reset]")) return act(() => api("/api/config/relay", { model: m, reset: true }), `${m}: built-in relay profile restored`).then(() => VIEWS.config(null, true));
    if (!e.target.closest("[data-save]")) return;
    act(() => api("/api/config/relay", { model: m, relay: v("relay").value, iface: v("iface").value, on: v("on").value, off: v("off").value,
      root: v("root").checked, readable: v("readable").checked, pulse: v("pulse").value, maintLink: v("maintLink").checked }), `${m} relay profile saved`).then(() => VIEWS.config(null, true));
  };
};

  const r = await api("/api/tickets?" + q).catch(e => ({ error: e.message, items: [], total: 0 }));

async function uploadTicketFile(id, f) {
  if (f.size > 10 * 1024 * 1024) throw new Error(`${f.name} is over 10 MB`);
  const r = await fetch(`/api/tickets/${id}/files?name=${encodeURIComponent(f.name)}`, { method: "POST", body: f });
  if (!r.ok) throw new Error(`${f.name}: ${(await r.json().catch(() => ({}))).error || "HTTP " + r.status}`);
}

// Site + technicians on a small Leaflet map (same tiles as the device map).
function drawTicketMap(place, cands) {
  const box = $("kMap"), pts = cands.filter(x => x.location);
  box.hidden = !place && !pts.length;
  if (box.hidden || typeof L === "undefined") return;
  if (!tMap || tMap.getContainer() !== box) {
    tMap = L.map(box, { scrollWheelZoom: false }).setView([1.3521, 103.8198], 11);
    const b = baseLayers();
    b.default.addTo(tMap);
    L.control.layers(b.all).addTo(tMap);
    tLayer = L.layerGroup().addTo(tMap);
  }
  tLayer.clearLayers();
  const ll = [];
  if (place) {
    L.circle([place.lat, place.lng], { radius: (Number($("kRadius").value) || 10) * 1000, color: "#f28c00", weight: 1, fillOpacity: .06 }).addTo(tLayer);
    L.circleMarker([place.lat, place.lng], { radius: 10, color: "#fff", weight: 3, fillColor: "#f28c00", fillOpacity: 1 }).bindPopup("<b>Site</b>").addTo(tLayer);
    ll.push([place.lat, place.lng]);
  }
  for (const x of pts) {
    L.circleMarker([x.location.lat, x.location.lng], { radius: 8, color: "#fff", weight: 2, fillColor: x.eligible ? "#22c55e" : "#94a3b8", fillOpacity: 1 })
      .bindPopup(`<b>${esc(x.name)}</b><br>${x.distanceKm ?? "?"} km · ${esc(AVAIL[x.availability]?.[1] || x.availability)}`).addTo(tLayer);
    ll.push([x.location.lat, x.location.lng]);
  }
  const key = location.hash + ":" + ll.length + ":" + $("kRadius").value; // fit once per ticket / radius, not on every 5 s refresh
  if (key !== tMapFit) { tMapFit = key; setTimeout(() => { tMap.invalidateSize(); if (ll.length) tMap.fitBounds(L.latLngBounds(ll).pad(0.25), { maxZoom: 15 }); }, 50); }
}

// ---------------- map (opens from the header) ----------------
// Map tiles: Esri satellite, OpenStreetMap streets and OneMap (Singapore's official map, free, no key).
function baseLayers() {
  const sat = L.layerGroup([L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Imagery &copy; Esri" }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 })]);
  const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" });
  const onemap = L.tileLayer("https://www.onemap.gov.sg/maps/tiles/Default/{z}/{x}/{y}.png", { minZoom: 11, maxZoom: 19,
    attribution: '<img src="https://www.onemap.gov.sg/web-assets/images/logo/om_logo.png" style="height:14px;width:14px"> OneMap &copy; Singapore Land Authority' });
  return { default: sat, all: { Satellite: sat, Street: street, "OneMap (SG)": onemap } };
}
let map, markers = {}, fitted = false;
function drawMap() {
  if (!map) {
    map = L.map("map").setView([1.3521, 103.8198], 11);
    const b = baseLayers();
    b.default.addTo(map);
    L.control.layers(b.all).addTo(map);
  }
  // Filters: site and a name / ID search. A device without its own GPS fix is drawn at its site's coordinates (hollow marker).
  const site = $("mapSite").value, q = $("mapQ").value.trim().toLowerCase(), seen = new Set(), perSite = {};
  let none = 0;
  for (const d of S.devices) {
    if (site && (d.group || "") !== (site === "__none" ? "" : site)) continue;
    if (q && ![label(d), d.code, d.id].some(x => String(x || "").toLowerCase().includes(q))) continue;
    const at = siteOf(d.group || ""), own = d.lat != null;
    if (!own && at.lat == null) { none++; continue; }
    seen.add(d.id);
    // ponytail: devices sharing a site's point get a small spiral offset so each one can be clicked
    const k = own ? 0 : (perSite[d.group] = (perSite[d.group] || 0) + 1) - 1;
    const ll = own ? [d.lat, d.lng] : [at.lat + 0.00006 * Math.sqrt(k) * Math.cos(k * 2.4), at.lng + 0.00006 * Math.sqrt(k) * Math.sin(k * 2.4)];

function maxMd(text) {

    .replace(/\[\[ticket:(T-\d+)\]\]/g, (m, n) => `<a href="#/team/tickets" data-tq="${n}">${n}</a>`);

  let list = null, table = null;
  const flush = () => { if (list) out.push(`<ul>${list.join("")}</ul>`); if (table) out.push(`<table>${table.join("")}</table>`); list = table = null; };
  for (const line of String(text).split("\n")) {
    const l = line.trim();
    if (/^\|.*\|$/.test(l)) {
      if (/^\|[\s:|-]+\|$/.test(l)) continue; // header separator
      if (list) flush();

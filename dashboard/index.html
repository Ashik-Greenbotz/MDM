<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Portal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f28c00">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --line: #e6e8eb; --hover: #f3f4f6;
    --accent: #f28c00; --accent-soft: #fff3e0; --accent-ink: #ffffff;
    --ok: #1e8e3e; --ok-soft: #e6f4ea; --bad: #d93025; --bad-soft: #fce8e6; --warn: #b06000; --warn-soft: #fef7e0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038; --hover: #22262d;
      --accent-soft: #3a2a12; --ok: #5bb974; --ok-soft: #1f3326; --bad: #ef7070; --bad-soft: #3b2121;
      --warn: #fdd663; --warn-soft: #3a3214; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }

  header { position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  header img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; }
  header h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .live.down i { background: var(--bad); }
  .bell { position: relative; }
  .bell b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

  .layout { display: grid; grid-template-columns: 210px minmax(0, 1fr); min-height: calc(100vh - 61px); }
  nav { background: var(--card); border-right: 1px solid var(--line); padding: 12px 8px; }
  nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--text); text-decoration: none; }
  nav a:hover { background: var(--hover); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a .c { margin-left: auto; font-size: 12px; color: var(--muted); }
  nav a .c.bad { color: var(--bad); font-weight: 700; }
  main { padding: 20px; max-width: 1500px; width: 100%; }
  main h2 { margin: 0 0 4px; font-size: 20px; }
  main .lead { color: var(--muted); margin: 0 0 16px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; gap: 2px; }
    nav a { white-space: nowrap; padding: 7px 10px; } nav a .c { display: none; }
    main { padding: 16px; } header { padding: 10px 16px; gap: 8px; } header .sub, #liveText { display: none; }
    header .btn { padding: 6px 9px; }
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
    text-align: left; text-decoration: none; color: inherit; display: block; }
  .stat:hover { border-color: var(--accent); }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .stat.ok .n { color: var(--ok); } .stat.bad .n { color: var(--bad); } .stat.warn .n { color: var(--warn); }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 16px; }
  .card > h3 { margin: 0; padding: 12px 16px; font-size: 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card > h3 .grow { flex: 1; }
  .pad { padding: 16px; }
  .toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--hover); }
  tbody tr.sel { background: var(--accent-soft); }
  td.wrap { white-space: normal; }
  td .row { flex-wrap: nowrap; }
  @media (max-width: 480px) { header h1 { display: none; } }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .type { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 5px; font-size: 11px; font-weight: 600;
    background: var(--hover); color: var(--muted); vertical-align: 1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.neutral { color: var(--muted); background: var(--hover); }
  .meter { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-size: 13px; }
  .meter .bar { width: 34px; height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter .bar b { display: block; height: 100%; background: var(--ok); }
  .meter.warn .bar b { background: var(--warn); } .meter.bad .bar b { background: var(--bad); }
  .btn { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
  form.grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  form.grid label { color: var(--muted); }
  @media (max-width: 600px) { form.grid { grid-template-columns: 1fr; } }
  .days label { margin-right: 8px; white-space: nowrap; color: var(--text) !important; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  .chart { width: 100%; height: 160px; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 16px 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
  pre.log { margin: 0; padding: 12px 16px; max-height: 480px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; }
  .qr svg { display: block; width: 280px; height: 280px; }
  .feat td:first-child { white-space: normal; }

  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px;
    width: min(520px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #mapDlg { width: min(1300px, calc(100vw - 24px)); height: min(860px, calc(100vh - 24px)); padding: 0; overflow: hidden; }
  #mapDlg .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #mapDlg .bar h2 { margin: 0; flex: 1; font-size: 16px; }
  #map { height: calc(100% - 53px); }
  .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; }

  .menu { position: fixed; z-index: 2000; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 4px; min-width: 170px; }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; border-radius: 6px; }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--bad); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px; }
  #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; display: grid; gap: 8px; }
  .toast { background: #1d2129; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); animation: in .2s ease-out; }
  .toast.err { background: var(--bad); }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <div>
    <h1>Device Portal</h1>
    <div class="sub">Interlock Group · every device across all sites</div>
  </div>
  <div class="grow"></div>
  <span class="live" id="live"><i></i><span id="liveText">Connecting…</span></span>
  <button class="btn" id="mapBtn" title="Live location of all devices">🗺 Map</button>
  <a class="btn bell" href="#/alerts" title="Open alerts">🔔<b id="bellN" hidden></b></a>
  <button class="btn" id="logout">Sign out</button>
</header>
<div class="layout">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="toasts"></div>
<dialog id="mapDlg">
  <div class="bar"><h2>Device locations</h2><span class="meta">🟢 online · 🔴 offline</span>
    <form method="dialog"><button class="btn">Close</button></form></div>
  <div id="map"></div>
</dialog>
<dialog id="dlg"></dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const ONLINE_MS = 90 * 1000;  // tablets check in every 10s, PCs and IoT agents every 30s
const LOW_BATTERY = 20;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const TYPES = { "android-kiosk": "Kiosk tablet", android: "Android", telpo: "Telpo", windows: "Windows PC", linux: "Linux", iot: "IoT" };
const CMD = {
  unlock: "Unlock (2 min)", lock: "Lock to kiosk", lockscreen: "Lock screen", ring: "Ring (find device)",
  reboot: "Restart", install: "Install / update app…", file: "Send file…", logs: "Get logs",
};
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const PAGES = [
  ["overview", "📊", "Overview"], ["devices", "📱", "Devices"], ["sites", "📍", "Sites"], ["alerts", "🔔", "Alerts"],
  ["tasks", "⏰", "Scheduled tasks"], ["apps", "📦", "Apps & files"], ["enroll", "➕", "Enroll devices"],
  ["activity", "📝", "Activity log"], ["features", "✅", "Features"],
];

let S = { devices: [], alerts: [], tasks: [], tokens: [], apps: [], files: [], sites: [], commands: {} };
let skew = 0, picked = new Set(), filters = { q: "", type: "", group: "", status: "" };
const now = () => Date.now() + skew;  // server clock, so "last seen" is right even if this PC's clock is off
const isOnline = d => d.lastSeen && now() - d.lastSeen < ONLINE_MS;
const label = d => d.name || d.deviceName || d.id.slice(0, 8);
const dev = id => S.devices.find(d => d.id === id);
// Sites (stored as d.group): every saved site, plus "" (no site) if any device has none.
const groups = () => [...new Set([...S.sites.map(x => x.name), ...S.devices.map(d => d.group || "")])].sort((a, b) => a ? b ? a.localeCompare(b) : -1 : 1);
const openAlerts = () => S.alerts.filter(a => !a.resolvedAt && !a.ackAt);
const ago = t => {
  if (!t) return "never";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(t).toLocaleString();
};
const fmtUptime = s => s == null ? "–" : s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " days";
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const statusPill = d => isOnline(d) ? `<span class="pill ok"><i></i>Online</span>` : `<span class="pill bad"><i></i>Offline</span>`;
const meter = (v, warnAt, badAt, suffix = "%", invert = false) => {
  if (v == null) return `<span class="meta">–</span>`;
  const lvl = invert ? (v < badAt ? "bad" : v < warnAt ? "warn" : "") : (v >= badAt ? "bad" : v >= warnAt ? "warn" : "");
  return `<span class="meter ${lvl}"><span class="bar"><b style="width:${Math.min(100, Math.max(0, v))}%"></b></span>${v}${suffix}</span>`;
};
const batt = d => d.battery == null ? `<span class="meta">–</span>` : meter(d.battery, 40, LOW_BATTERY, "%", true) + (d.charging ? " ⚡" : "");
const stateCell = d => d.pending ? `<span class="pill neutral">Sending ${esc(CMD[d.pending] || d.pending)}…</span>`
  : d.type !== "android-kiosk" ? `<span class="meta">${d.uptime != null ? "Up " + fmtUptime(d.uptime) : "Monitored"}</span>`
  : d.kioskLocked === false ? `<span class="pill warn"><i></i>Unlocked</span>` : `<span class="pill ok"><i></i>Locked</span>`;
const options = (list, sel) => list.map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(t)}</option>`).join("");
const groupName = g => g || "No site";

function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("toasts").append(t);
  setTimeout(() => t.remove(), 3500);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
  return data;
}
const act = async (fn, okMsg) => {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); }
  catch (e) { toast("Failed: " + e.message, true); }
  await refresh();
};

// ---------------- data + routing ----------------
async function refresh() {
  try {
    const r = await api("/api/state");
    skew = r.now - Date.now();
    r.devices.sort((a, b) => label(a).localeCompare(label(b)));
    S = r;
    $("live").classList.remove("down");
    $("liveText").textContent = "Live · " + new Date().toLocaleTimeString();
  } catch (e) {
    $("live").classList.add("down");
    $("liveText").textContent = "Server unreachable";
    return;
  }
  for (const id of picked) if (!dev(id)) picked.delete(id);
  const n = openAlerts().length;
  $("bellN").hidden = !n;
  $("bellN").textContent = n;
  renderNav();
  route(true);
  if ($("mapDlg").open) drawMap();
}

function renderNav() {
  const cur = (location.hash.slice(2) || "overview").split("/")[0];
  const counts = { devices: S.devices.length, sites: groups().filter(Boolean).length, alerts: openAlerts().length, tasks: S.tasks.length };
  $("nav").innerHTML = PAGES.map(([k, icon, t]) => `<a href="#/${k}" class="${cur === k || (cur === "device" && k === "devices") ? "on" : ""}">
    <span>${icon}</span>${t}${counts[k] ? `<span class="c ${k === "alerts" ? "bad" : ""}">${counts[k]}</span>` : ""}</a>`).join("");
}

// Live pages redraw every 5 s; pages with forms only redraw their lists (`live` = called from refresh).
let lastPage = "";
function route(live) {
  const [page, arg] = (location.hash.slice(2) || "overview").split("/");
  const fresh = page + "/" + arg !== lastPage;
  lastPage = page + "/" + arg;
  const fn = VIEWS[page] || VIEWS.overview;
  if (!live || fresh) { renderNav(); $("view").innerHTML = ""; }
  fn(arg ? decodeURIComponent(arg) : undefined, !live || fresh);
}
window.onhashchange = () => route(false);

// ---------------- views ----------------
const VIEWS = {};

VIEWS.overview = () => {
  const ds = S.devices, on = ds.filter(isOnline);
  const byType = Object.entries(ds.reduce((m, d) => (m[d.type] = (m[d.type] || 0) + 1, m), {}));
  const recentAlerts = S.alerts.filter(a => !a.resolvedAt).slice(-6).reverse();
  $("view").innerHTML = `
    <h2>Overview</h2><p class="lead">All devices across all sites, updated live.</p>
    <div class="stats">
      <a class="stat" href="#/devices"><div class="n">${ds.length}</div><div class="l">Total devices</div></a>
      <a class="stat ok" href="#/devices" data-status="online"><div class="n">${on.length}</div><div class="l">Online</div></a>
      <a class="stat bad" href="#/devices" data-status="offline"><div class="n">${ds.length - on.length}</div><div class="l">Offline</div></a>
      <a class="stat warn" href="#/devices" data-status="unlocked"><div class="n">${ds.filter(d => d.kioskLocked === false && d.type === "android-kiosk").length}</div><div class="l">Unlocked kiosks</div></a>
      <a class="stat warn" href="#/devices" data-status="low"><div class="n">${ds.filter(d => d.battery != null && d.battery < LOW_BATTERY).length}</div><div class="l">Low battery</div></a>
      <a class="stat bad" href="#/alerts"><div class="n">${openAlerts().length}</div><div class="l">Open alerts</div></a>
    </div>
    <div class="cols">
      <div class="card"><h3>By device type</h3><table><tbody>${byType.map(([t, n]) => {
        const o = ds.filter(d => d.type === t && isOnline(d)).length;
        return `<tr class="click" data-type="${esc(t)}"><td>${esc(TYPES[t] || t)}</td><td>${n} device${n > 1 ? "s" : ""}</td><td><span class="pill ok">${o} online</span></td></tr>`;
      }).join("") || `<tr><td class="empty">No devices yet</td></tr>`}</tbody></table></div>
      <div class="card"><h3>By site<span class="grow"></span><a href="#/sites" class="meta">All sites →</a></h3><table><tbody>${groups().map(g => {
        const list = ds.filter(d => (d.group || "") === g), o = list.filter(isOnline).length;
        return `<tr class="click" data-group="${esc(g)}"><td>${esc(groupName(g))}</td><td>${list.length} device${list.length === 1 ? "" : "s"}</td><td>${!list.length ? `<span class="pill neutral">empty</span>` : o === list.length ? `<span class="pill ok">all online</span>` : `<span class="pill bad">${list.length - o} offline</span>`}</td></tr>`;
      }).join("") || `<tr><td class="empty">No sites yet. <a href="#/sites">Add one</a></td></tr>`}</tbody></table></div>
      <div class="card"><h3>Open alerts<span class="grow"></span><a href="#/alerts" class="meta">All alerts →</a></h3>
        <table><tbody>${recentAlerts.map(a => `<tr><td>${alertIcon(a)}</td><td class="wrap">${esc(a.text)}</td><td class="meta">${ago(a.at)}</td></tr>`).join("")
        || `<tr><td class="empty">No open alerts 🎉</td></tr>`}</tbody></table></div>
    </div>`;
  $("view").onclick = e => {
    const t = e.target.closest("[data-type],[data-group],[data-status]");
    if (!t) return;
    filters = { q: "", type: t.dataset.type || "", group: t.dataset.group ?? "", status: t.dataset.status || "" };
    if (t.dataset.group !== undefined) filters.group = t.dataset.group || "__none";
    location.hash = "#/devices";
  };
};

const STATUS = {
  "": ["All statuses", () => true], online: ["Online", isOnline], offline: ["Offline", d => !isOnline(d)],
  unlocked: ["Unlocked kiosks", d => d.type === "android-kiosk" && d.kioskLocked === false],

function rowClick(e) {

}

function deviceAction(d, a) {
  if (a === "open") location.hash = "#/device/" + encodeURIComponent(d.id);

    const name = prompt("Device name (e.g. site + location):", label(d));
    if (name && name.trim()) act(() => api(`/api/devices/${d.id}/name`, { name }), "Renamed");
  }
  if (a === "group") askGroup(label(d), d.group || "", g => act(() => api(`/api/devices/${d.id}/group`, { group: g }), "Moved"));
  if (a === "delete" && confirm(`Remove ${label(d)} from the portal? It comes back if it checks in again.`)) {
    act(() => api(`/api/devices/${d.id}/delete`, {}), "Removed").then(() => { if (location.hash.startsWith("#/device/")) location.hash = "#/devices"; });
  }
}

// Sends one command to a list of devices. install / file ask which app / file first.
async function command(list, type, extra = {}) {
  if (type === "install" && !extra.appId) return pickUpload("apps", list, type);
  if (type === "file" && !extra.fileId) return pickUpload("files", list, type);
  const names = list.length === 1 ? label(list[0]) : list.length + " devices";
  if (type === "reboot" && !confirm(`Restart ${names}?`)) return;
  if (list.length === 1 && !isOnline(list[0]) && !confirm(`${names} is offline. Send anyway? It runs when the device reconnects.`)) return;
  if (list.length > 1 && !confirm(`Send "${CMD[type].replace("…", "")}" to ${names}?`)) return;
  await act(() => list.length === 1
      ? api(`/api/devices/${list[0].id}/command`, { type, ...extra })
      : api("/api/bulk", { target: { ids: list.map(d => d.id) }, action: "command", type, ...extra }),
    r => `${CMD[type].replace("…", "")} sent to ${r.count ?? 1} device${(r.count ?? 1) === 1 ? "" : "s"}`);
}

function pickUpload(kind, list, type) {
  const items = S[kind];
  if (!items.length) { toast(`Upload ${kind === "apps" ? "an app" : "a file"} first on the Apps & files page`, true); location.hash = "#/apps"; return; }
  dialog(`<h2>${kind === "apps" ? "Install / update app" : "Send file"}</h2>
    <p class="meta">${list.length === 1 ? esc(label(list[0])) : list.length + " devices"}. ${kind === "apps" ? "Installs silently on device-owner devices." : "Saved in the device's Download/Kiosk folder."}</p>
    <select id="upPick" style="width:100%">${options(items.map(x => [x.id, (x.label || x.name) + " · " + fmtSize(x.size)]))}</select>`,
    "Send", () => command(list, type, kind === "apps" ? { appId: $("upPick").value } : { fileId: $("upPick").value }));
}

// history rows: [time, battery, cpu, ram, disk, temp]
function chart(h) {
  if (!h || h.length < 2) return `<p class="empty">Collecting… a point is saved every 5 minutes.</p>`;
  const W = 600, H = 160, t0 = h[0][0], t1 = h[h.length - 1][0] || t0 + 1;
  const lines = [["Battery %", 1, css("--ok")], ["Memory %", 3, "#3b82f6"], ["Storage %", 4, css("--accent")]];
  const x = t => 4 + (W - 8) * (t - t0) / Math.max(1, t1 - t0), y = v => H - 6 - (H - 12) * v / 100;
  const paths = lines.filter(([, i]) => h.some(r => r[i] != null)).map(([n, i, c]) =>
    `<polyline fill="none" stroke="${c}" stroke-width="2" points="${h.filter(r => r[i] != null).map(r => x(r[0]).toFixed(1) + "," + y(r[i]).toFixed(1)).join(" ")}"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${[25, 50, 75].map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}" stroke-dasharray="3 4"/>`).join("")}${paths.join("")}</svg>
    <div class="legend">${lines.filter(([, i]) => h.some(r => r[i] != null)).map(([n, , c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}
      <span>${new Date(t0).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} → now</span></div>`;
}

VIEWS.tasks = (arg, first) => {

    $("view").innerHTML = `<h2>Scheduled tasks</h2><p class="lead">Run a command automatically at a set time, e.g. restart every device at a site each night at 3:00, or install an app update on Sunday.</p>
      <div class="card"><h3>New task</h3><form class="grid pad" id="tForm">
        <label>Name</label><input id="tName" placeholder="e.g. Nightly restart" required>
        <label>Command</label><select id="tType">${options(["reboot", "lockscreen", "lock", "install", "file", "logs", "ring"].map(c => [c, CMD[c].replace("…", "")]))}</select>
        <label id="tUpL" hidden>App / file</label><select id="tUp" hidden></select>
        <label>Devices</label><select id="tTarget"></select>
        <label>Time</label><input type="time" id="tTime" value="03:00" required>
        <label>Days</label><div class="days">${DAYS.map((d, i) => `<label><input type="checkbox" value="${i}" checked> ${d}</label>`).join("")}</div>
        <span></span><div><button class="btn primary">Add task</button></div>
      </form></div>
      <div class="card"><h3>Tasks</h3><div class="table-wrap"><table><thead><tr><th>Name</th><th>Command</th><th>Devices</th><th>When</th><th>Last run</th><th>On</th><th></th></tr></thead>
        <tbody id="tRows"></tbody></table></div></div>`;
    const syncUp = () => {
      const t = $("tType").value, kind = t === "install" ? "apps" : t === "file" ? "files" : null;
      $("tUp").hidden = $("tUpL").hidden = !kind;
      if (kind) $("tUp").innerHTML = options(S[kind].map(x => [x.id, x.label || x.name])) || `<option value="">Upload one on Apps & files first</option>`;
    };
    $("tType").onchange = syncUp;
    syncUp();
    $("tTarget").innerHTML = targetSelect();
    $("tForm").onsubmit = e => {
      e.preventDefault();
      const type = $("tType").value;
      act(() => api("/api/tasks", { name: $("tName").value, type, appId: type === "install" ? $("tUp").value : undefined,
        fileId: type === "file" ? $("tUp").value : undefined, target: parseTarget($("tTarget").value), time: $("tTime").value,
        days: [...document.querySelectorAll(".days input:checked")].map(i => +i.value) }).then(() => $("tName").value = ""), "Task added");
    };
    $("tRows").onclick = e => {
      const b = e.target.closest("[data-t]");
      if (!b) return;
      const t = S.tasks.find(x => x.id === b.dataset.id);
      if (b.dataset.t === "run") act(() => api(`/api/tasks/${t.id}/run`, {}), r => `Sent to ${r.count} device${r.count === 1 ? "" : "s"}`);
      if (b.dataset.t === "del" && confirm(`Delete task "${t.name}"?`)) act(() => api(`/api/tasks/${t.id}/delete`, {}), "Deleted");
      if (b.dataset.t === "toggle") act(() => api("/api/tasks", { ...t, enabled: b.checked }));
    };
  }
  const upName = t => t.type === "install" ? S.apps.find(a => a.id === t.appId)?.label : t.type === "file" ? S.files.find(f => f.id === t.fileId)?.name : "";
  $("tRows").innerHTML = S.tasks.map(t => `<tr><td class="name">${esc(t.name)}</td>
      <td>${esc(CMD[t.type].replace("…", ""))}${upName(t) ? `<div class="meta">${esc(upName(t))}</div>` : ""}</td><td>${esc(targetText(t.target))}</td>
      <td>${t.time} · ${t.days.length === 7 ? "every day" : t.days.map(i => DAYS[i]).join(", ")}</td><td class="meta">${t.lastRun ? ago(t.lastRun) : "never"}</td>
      <td><input type="checkbox" data-t="toggle" data-id="${t.id}" ${t.enabled ? "checked" : ""} aria-label="Enabled"></td>
      <td><div class="row"><button class="btn" data-t="run" data-id="${t.id}">Run now</button><button class="btn ghost" data-t="del" data-id="${t.id}">Delete</button></div></td></tr>`).join("")
    || `<tr><td colspan="7" class="empty">No tasks yet</td></tr>`;
};

async function upload(kind, file, labelText) {
  const q = new URLSearchParams({ kind, name: file.name, ...(labelText ? { label: labelText } : {}) });
  const r = await fetch("/api/upload?" + q, { method: "POST", body: file });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
}

VIEWS.apps = (arg, first) => {
  if (first) {
    $("view").innerHTML = `<h2>Apps & files</h2><p class="lead">Upload an app (.apk) once, then install or update it on any devices: silently, no tap needed on device-owner devices (OTA update).
      Files are sent to the device's Download/Kiosk folder.</p>
      <div class="cols">
        <div class="card"><h3>Upload app (.apk)</h3><form class="pad row" id="aForm">
          <input type="file" id="aFile" accept=".apk" required><input id="aLabel" placeholder="Name (e.g. VMS v2.1)">
          <button class="btn primary">Upload</button></form></div>
        <div class="card"><h3>Upload file</h3><form class="pad row" id="fForm">
          <input type="file" id="fFile" required><button class="btn primary">Upload</button></form></div>
      </div>
      <div class="card"><h3>Apps</h3><div class="table-wrap"><table><thead><tr><th>App</th><th>Size</th><th>Uploaded</th><th>Enrollment</th><th></th></tr></thead><tbody id="aRows"></tbody></table></div></div>
      <div class="card"><h3>Files</h3><div class="table-wrap"><table><thead><tr><th>File</th><th>Size</th><th>Uploaded</th><th></th></tr></thead><tbody id="fRows"></tbody></table></div></div>`;
    $("aForm").onsubmit = e => { e.preventDefault(); const f = $("aFile").files[0]; toast("Uploading…"); act(() => upload("app", f, $("aLabel").value).then(() => e.target.reset()), "App uploaded"); };
    $("fForm").onsubmit = e => { e.preventDefault(); const f = $("fFile").files[0]; toast("Uploading…"); act(() => upload("file", f).then(() => e.target.reset()), "File uploaded"); };

      if (b.dataset.x === "kiosk") act(() => api(`/api/apps/${id}/kiosk`, {}), "Used for QR enrollment");

  $("aRows").innerHTML = S.apps.slice().reverse().map(a => `<tr><td class="name">${esc(a.label)}</td><td>${fmtSize(a.size)}</td><td class="meta">${ago(a.at)}</td>
      <td>${S.kioskApp === a.id ? `<span class="pill ok">Used for QR enrollment</span>` : `<button class="btn ghost" data-x="kiosk" data-kind="apps" data-id="${a.id}">Use for QR</button>`}</td>
      <td><div class="row"><button class="btn primary" data-x="send" data-kind="apps" data-id="${a.id}">Install on devices…</button>
      <button class="btn ghost" data-x="del" data-kind="apps" data-id="${a.id}">Delete</button></div></td></tr>`).join("") || `<tr><td colspan="5" class="empty">No apps uploaded</td></tr>`;
  $("fRows").innerHTML = S.files.slice().reverse().map(f => `<tr><td class="name">${esc(f.name)}</td><td>${fmtSize(f.size)}</td><td class="meta">${ago(f.at)}</td>
      <td><div class="row"><button class="btn primary" data-x="send" data-kind="files" data-id="${f.id}">Send to devices…</button>
      <button class="btn ghost" data-x="del" data-kind="files" data-id="${f.id}">Delete</button></div></td></tr>`).join("") || `<tr><td colspan="4" class="empty">No files uploaded</td></tr>`;
};

// Pick which devices get an app / file: all, a site, a type, or the ones ticked on the Devices page.
function chooseDevices(cmd, done) {
  const able = S.devices.filter(d => (S.commands[d.type] || []).includes(cmd));
  if (!able.length) return toast("No devices can do this yet", true);
  dialog(`<h2>Choose devices</h2><select id="cdT" style="width:100%">${picked.size ? `<option value="picked">${picked.size} selected on the Devices page</option>` : ""}${targetSelect()}</select>
    <p class="meta">Only Android devices running the kiosk app can receive apps and files (${able.length} now).</p>`, "Next", () => {
      const v = $("cdT").value, t = v === "picked" ? null : parseTarget(v);
      const list = (v === "picked" ? [...picked].map(dev) : S.devices.filter(d => t.all || (t.group != null ? (d.group || "") === t.group : d.type === t.type)))
        .filter(d => d && able.includes(d));
      list.length ? done(list) : toast("None of those devices can do this", true);
    });
}

VIEWS.enroll = (arg, first) => {

    $("view").innerHTML = `<h2>Enroll devices</h2><p class="lead">Three ways to add a device. Tokens put new devices straight into the right site and mode.</p>
      <div class="cols">
        <div class="card"><h3>1 · Create an enrollment token</h3><form class="grid pad" id="kForm">
          <label>Name</label><input id="kLabel" placeholder="e.g. Site A lobby" required>
          <label>Site</label><select id="kGroup"></select>
          <label>Mode</label><select id="kMode"><option value="kiosk">Kiosk (locked to allowed apps)</option><option value="monitor">Monitor only (device works normally)</option></select>
          <span></span><div><button class="btn primary">Create token</button></div></form>
          <div class="table-wrap"><table><thead><tr><th>Token</th><th>Site</th><th>Mode</th><th>Used</th><th></th></tr></thead><tbody id="kRows"></tbody></table></div></div>
        <div class="card"><h3>2 · QR code (new or factory-reset Android)</h3><div class="pad">
          <form class="grid" id="qForm">
            <label>Token</label><select id="qTok"></select>
            <label>Server address</label><input id="qServer" value="${esc(lanGuess)}" required>
            <label>Wi-Fi name</label><input id="qSsid" placeholder="optional: device joins this Wi-Fi during setup">
            <label>Wi-Fi password</label><input id="qPass" type="password" autocomplete="off">
            <span></span><div><button class="btn primary">Make QR code</button></div></form>
          <div id="qOut" style="margin-top:14px"></div>
          <p class="meta">On the device: factory reset → on the first <b>Welcome</b> screen tap the same spot 6 times → scan this code. Android 9+ (Telpo terminals, Samsung tablets, phones).
          The device must reach the server address, so use this PC's network IP, not "localhost".</p></div></div>
      </div>
      <div class="card"><h3>3 · USB cable (device already set up, no accounts on it)</h3><div class="pad">
        <p>Turn on USB debugging, connect, then double-click <b>setup-tablet.bat</b> (kiosk) or run <code>setup-tablet.bat monitor</code> (monitor only) in the project folder.</p>
        <p class="meta">Windows PCs: run <code>agents\\agent.ps1</code>. Linux: run <code>agents/agent.sh</code>. IoT boards: see <code>agents/esp32.ino</code>.</p></div></div>`;
    $("kForm").onsubmit = e => { e.preventDefault(); act(() => api("/api/tokens", { label: $("kLabel").value, group: $("kGroup").value, mode: $("kMode").value }).then(() => e.target.reset()), "Token created"); };
    $("qForm").onsubmit = async e => {
      e.preventDefault();
      try {
        const r = await api("/api/qr", { token: $("qTok").value, server: $("qServer").value.trim(), wifiSsid: $("qSsid").value, wifiPassword: $("qPass").value });
        const qr = qrcode(0, "L");
        qr.addData(r.qr);
        qr.make();
        $("qOut").innerHTML = `<div class="qr">${qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true })}</div>`;
      } catch (err) { toast("Failed: " + err.message, true); }
    };
    $("kRows").onclick = e => {
      const b = e.target.closest("[data-del]");
      if (b && confirm("Delete this token? Devices already enrolled stay.")) act(() => api("/api/tokens/delete", { token: b.dataset.del }), "Deleted");
    };
  }
  const kSel = $("kGroup").value;
  $("kGroup").innerHTML = options([["", "No site"], ...groups().filter(Boolean).map(g => [g, g])], kSel);
  const sel = $("qTok").value;
  $("qTok").innerHTML = options(S.tokens.map(t => [t.token, t.label + (t.group ? " → " + t.group : "")]), sel) || `<option value="">Create a token first</option>`;
  $("kRows").innerHTML = S.tokens.slice().reverse().map(t => `<tr><td><div class="name">${esc(t.label)}</div><code class="meta">${esc(t.token)}</code></td>
      <td>${esc(t.group || "–")}</td><td>${t.mode === "monitor" ? "Monitor" : "Kiosk"}</td><td>${t.uses || 0}×</td>
      <td><button class="btn ghost" data-del="${esc(t.token)}">Delete</button></td></tr>`).join("") || `<tr><td colspan="5" class="empty">No tokens yet</td></tr>`;
};

    || `<tr><td class="empty">Nothing yet</td></tr>`;
};

// ---------------- map (opens from the header) ----------------
let map, markers = {}, fitted = false;
function drawMap() {
  if (!map) {
    map = L.map("map").setView([1.3521, 103.8198], 11);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: "Imagery &copy; Esri" });
    const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 });
    const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" });
    L.layerGroup([sat, labels]).addTo(map);
    L.control.layers({ "Satellite": L.layerGroup([sat, labels]), "Street": street }).addTo(map);
  }
  const seen = new Set();
  for (const d of S.devices) {
    if (d.lat == null) continue;
    seen.add(d.id);
    const popup = `<b>${esc(label(d))}</b><br>${isOnline(d) ? "Online" : "Offline"}${d.battery != null ? " · battery " + d.battery + "%" : ""}<br>
      <span class="meta">±${Math.round(d.accuracy || 0)} m · ${ago(d.locationTime)}</span><br><a href="#/device/${encodeURIComponent(d.id)}" onclick="$('mapDlg').close()">Open device →</a>`;
    markers[d.id] ||= L.circleMarker([d.lat, d.lng], { radius: 9, weight: 3, fillOpacity: .95 }).addTo(map);
    markers[d.id].setLatLng([d.lat, d.lng]).setStyle({ color: "#fff", fillColor: isOnline(d) ? "#22c55e" : "#ef4444" }).bindPopup(popup);
  }
  for (const id in markers) if (!seen.has(id)) { markers[id].remove(); delete markers[id]; }
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!fitted && pts.length) { map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 17 }); fitted = true; }
}
function openMap(d) {
  $("mapDlg").showModal();
  drawMap();
  map.invalidateSize();
  if (d) {
    if (!markers[d.id]) return toast("No location from this device yet", true);
    map.setView(markers[d.id].getLatLng(), 18);
    markers[d.id].openPopup();
  }
  const n = S.devices.filter(x => x.lat == null).length;
  if (!d && n) toast(`${n} device${n > 1 ? "s have" : " has"} no location (no GPS or not an Android device)`);
}
$("mapBtn").onclick = () => openMap();
$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login"; };

route(false);
refresh();
setInterval(refresh, 5000);

  const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
  for (let i = 0; i < p.length; i += 4) {
    const t = Math.max(0, Math.min(1, (p[i + 2] - p[i]) / 200)); // how cyan: blue well above red
    if (!t) continue;
    const v = Math.max(p[i + 1], p[i + 2]) / 255, r = p[i];
    for (let k = 0; k < 3; k++) p[i + k] = r * (1 - t) + ORANGE[k] * v * t;
  }
  g.putImageData(d, 0, 0);
  const n = new THREE.CanvasTexture(c);
  Object.assign(n, { flipY: tex.flipY, colorSpace: tex.colorSpace, wrapS: tex.wrapS, wrapT: tex.wrapT, channel: tex.channel });
  return n;
}
model.traverse(o => {
  const m = o.material;
  if (m?.name !== "Logo" || m.userData.orange) return;
  if (m.map) m.map = orangeTex(m.map);
  if (m.emissiveMap) m.emissiveMap = orangeTex(m.emissiveMap);
  m.userData.orange = m.needsUpdate = true;
});
holder.add(model);
scene.add(holder);
// Lying on his bed: turned onto his side (head on the pillow, left), body centred over the mattress.
const body = new THREE.Box3().setFromObject(model), BED_Y = -0.08; // ponytail: mattress height in scene units, matched to .max-bed by eye
const LIE = { x: (body.min.y + body.max.y) / 2, y: BED_Y + (body.max.x - body.min.x) / 2 };
let lie = 0;
const mixer = new THREE.AnimationMixer(model), clips = Object.fromEntries(gltf.animations.map(c => [c.name, c]));
document.body.append(el);
document.getElementById("maxBtn").classList.add("gone"); // the 3D Max replaces the flat button
// Panel header avatar: a still of the 3D model.
renderer.render(scene, camera);
for (const img of document.querySelectorAll(".max-face img")) img.src = canvas.toDataURL();

// ---- animation: one looping base clip, one-shots fade back into it ----
let base = null, current = null;
function play(name, { once = false, fade = 0.35, then } = {}) {
  const clip = clips[name];
  if (!clip) return;
  const a = mixer.clipAction(clip);
  a.reset();
  a.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = once;
  if (current && current !== a) current.crossFadeTo(a, fade, false);
  a.play();
  current = a;
  if (once) {
    const done = e => { if (e.action !== a) return; mixer.removeEventListener("finished", done); if (current === a) (then ? then() : loop(base)); };
    mixer.addEventListener("finished", done);
  } else base = name;
}
const loop = name => play(name);
const pick = list => list[Math.floor(Math.random() * list.length)];

// ---- where Max is: CSS position of the canvas (top-left), moved with a transform ----
const pos = { x: 0, y: 0 };
let flight = null, mode = "idle", dragged = null, homeOverride = null;
const place = () => { el.style.transform = `translate3d(${Math.round(pos.x)}px, ${Math.round(pos.y)}px, 0)`; };
const panel = () => document.getElementById("maxPanel");
function home() {
  if (homeOverride) return homeOverride;
  const p = panel();
  if (p && !p.hidden) { const r = p.getBoundingClientRect(); return { x: Math.max(4, r.left - SIZE * 0.72), y: Math.max(4, r.top - SIZE * 0.25) }; }
  return { x: innerWidth - SIZE - (small() ? 4 : 14), y: innerHeight - SIZE - (small() ? 4 : 10) };
}
// Fly to a point (top-left of the canvas). Take off, cruise leaning into the turn, brake on arrival.
function flyTo(x, y, after) {
  x = Math.min(Math.max(0, x), innerWidth - SIZE);
  y = Math.min(Math.max(0, y), innerHeight - SIZE);
  const dist = Math.hypot(x - pos.x, y - pos.y);
  if (calm || !moves || dist < 30) { pos.x = x; pos.y = y; place(); return after?.(); }
  flight = { from: { ...pos }, to: { x, y }, t0: performance.now(), ms: Math.min(2200, Math.max(700, dist * 1.3)), after };
  if (mode === "fly") loop("Fly_Cruise"); else play("TakeOff", { once: true, fade: 0.2, then: () => loop("Fly_Cruise") });
  mode = "fly";
}
const goHome = after => { const h = home(); flyTo(h.x, h.y, () => { play("Return_Land", { once: true }); after?.(); }); };

// ---- speech bubble ----
let bubbleTimer;
function say(text, ms = 6000, tone = "") {
  clearTimeout(bubbleTimer);
  if (!text) { bubble.hidden = true; return; }
  window.maxVoice?.(text);
  ms = Math.max(ms, 1500 + text.length * 70); // stays up while it is being read out
  bubble.textContent = text;
  bubble.className = "max-bubble " + tone;
  bubble.hidden = false;
  // above Max, or below him near the top of the screen; flipped to his left near the right edge
  bubble.classList.toggle("below", pos.y < 110);
  bubble.classList.toggle("left", pos.x > innerWidth - 300);
  bubbleTimer = setTimeout(() => (bubble.hidden = true), ms);
}
bubble.onclick = () => (bubble.hidden = true);

// ---- pointing at things on the page ----
let spot = null;
function highlight(target, ms) {
  spot?.classList.remove("max-spot");
  spot = target;
  target.classList.add("max-spot");
  setTimeout(() => { target.classList.remove("max-spot"); if (spot === target) spot = null; }, ms);
}
// Flies next to an element (left of it if there is room, else right / below), points, says text, then goes home.
function pointAt(target, text, { ms = 6500, tone = "", alert = false, stay = false } = {}) {
  if (!target?.isConnected) return say(text, ms, tone);
  if (!stay) target.scrollIntoView({ block: "center", behavior: calm ? "auto" : "smooth" });
  setTimeout(() => {
    const r = target.getBoundingClientRect();
    const left = r.left - SIZE * 0.9 > 0, x = left ? r.left - SIZE * 0.9 : Math.min(r.right - SIZE * 0.1, innerWidth - SIZE);
    const y = r.top + r.height / 2 - SIZE * 0.55;
    holderFace = left ? 1 : -1; // turn towards the element
    flyTo(x, y, () => {
      highlight(target, ms);
      say(text, ms, tone);
      if (alert) play("T_Fly_To_Alert", { once: true, then: () => loop("Alert_Critical_Wave") });
      else play("T_Fly_To_Point", { once: true, then: () => { play("Point_In", { once: true, then: () => loop("Point_Hold") }); } });
      mode = "point";
      clearTimeout(pointTimer);
      pointTimer = setTimeout(() => { holderFace = 0; play("Point_Out", { once: true }); setTimeout(() => goHome(doze), 700); }, ms);
    });
  }, stay ? 0 : 350);
}
let pointTimer, holderFace = 0;

// ---- chat moods ----
function listen() { if (flight) return; mode = "listen"; play("T_Idle_To_Listen", { once: true, then: () => loop(pick(["Listen", "Listen_B", "Listen_C"])) }); }
function think() { if (flight) return; mode = "think"; play("T_Listen_To_Think", { once: true, then: () => loop("Think") }); }
function talk(text) {
  mode = "talk";
  // gestures for about as long as the answer takes to read / speak
  const ms = Math.min(14000, 1800 + text.length * 45);
  play("T_Think_To_Talk", { once: true, then: () => loop(pick(["Talk_Gesture_A", "Talk_Gesture_B", "Talk_Gesture_C", "Talk_Gesture_D", "Talk_Gesture_E", "Talk_Gesture_F", "Talk_Gesture_G"])) });
  clearTimeout(talkTimer);
  talkTimer = setTimeout(() => { if (mode === "talk") { mode = "idle"; play("T_Talk_To_Idle", { once: true, then: () => loop("Idle_Hover") }); } }, ms);
}
let talkTimer;
function greet() { play("Greet_Salute", { once: true, then: () => loop("Idle_Hover") }); }

// ---- sleep: dimmed in his corner with 💤 and quiet; an alert wakes him for its message, then he dozes off again ----
function doze() { if (!sleeping) return; el.classList.add("asleep"); mixer.timeScale = 0.25; loop("Idle_Hover"); }
function rouse() { el.classList.remove("asleep"); mixer.timeScale = 1; }
function setSleep(v) {
  sleeping = v;
  try { localStorage.setItem("maxSleep", v ? "on" : "off"); } catch {}
  if (v) { stopTour(); homeOverride = null; goHome(doze); } else { rouse(); play("Notice_User", { once: true, then: greet }); }
}

// ---- idle life: small one-shot fidgets; bored after a few quiet minutes ----
let lastUser = Date.now();
for (const ev of ["pointerdown", "keydown", "wheel"]) addEventListener(ev, () => (lastUser = Date.now()), { passive: true });
setInterval(() => {
  if (mode !== "idle" || document.hidden || sleeping) return;
  if (Date.now() - lastUser > 3 * 60000) return play("Bored", { once: true });
  if (Math.random() < 0.45) play(pick(["Idle_Adjust_Cap", "Idle_Check_Watch", "Look_Around", "Idle_Stretch", "Idle_Scan_Patrol", "Idle_Boot_Check", "Idle_Hover_B"]), { once: true });
}, 9000);

// ---- drag to move, click to open the chat, double-click to send him home ----
canvas.addEventListener("pointerdown", e => {
  dragged = { sx: e.clientX, sy: e.clientY, x: pos.x, y: pos.y, moved: false };
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", e => {
  if (!dragged) return;
  const dx = e.clientX - dragged.sx, dy = e.clientY - dragged.sy;
  if (!dragged.moved && Math.hypot(dx, dy) < 6) return;
  if (!dragged.moved) { dragged.moved = true; flight = null; play("Notice_User", { once: true, then: () => loop("Idle_Hover") }); }
  pos.x = Math.min(Math.max(0, dragged.x + dx), innerWidth - SIZE);
  pos.y = Math.min(Math.max(0, dragged.y + dy), innerHeight - SIZE);
  place();
});
canvas.addEventListener("pointerup", () => {
  const d = dragged;
  dragged = null;
  if (d?.moved) { homeOverride = { x: pos.x, y: pos.y }; return; } // stays where it was dropped
  const p = panel();
  stopTour(); // stops a running tour
  if (sleeping) setSleep(false); // clicking wakes him
  if (p.hidden) { maxOpen(true); setTimeout(() => goHome(), 50); }
  maxHello();
});
canvas.addEventListener("dblclick", () => { homeOverride = null; goHome(); });

// ---- frame loop ----
const clock = new THREE.Clock();
let turn = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), 0.1);
  if (flight) {
    const k = Math.min(1, (now - flight.t0) / flight.ms), e = k < 0.5 ? 2 * k * k : 1 - (-2 * k + 2) ** 2 / 2;
    const dx = flight.to.x - flight.from.x;
    pos.x = flight.from.x + dx * e;
    pos.y = flight.from.y + (flight.to.y - flight.from.y) * e - Math.sin(k * Math.PI) * Math.min(80, Math.abs(dx) * 0.15); // a little arc
    place();
    turn += ((Math.sign(dx) * 0.9) - turn) * 0.12;  // face the way he flies, bank into it
    holder.rotation.z = -turn * 0.25;
    if (k >= 1) {
      const f = flight;
      flight = null;
      holder.rotation.z = 0;
      mode = "idle";
      play("Arrive_Brake", { once: true, fade: 0.2 });
      f.after?.(); // may start pointing / landing right away
    }
  } else turn += ((lie > 0.01 ? 0 : holderFace * 0.7) - turn) * 0.08;
  holder.rotation.y = turn;
  lie += ((el.classList.contains("asleep") ? 1 : 0) - lie) * (calm ? 1 : 0.06);
  if (!flight) holder.rotation.z = lie * Math.PI / 2;
  holder.position.set(lie * LIE.x, lie * LIE.y, 0);
  holder.scale.setScalar(1 - lie * 0.15);
  mixer.update(dt);
  renderer.render(scene, camera);
}
const h0 = window.maxJustIn ? { x: (innerWidth - SIZE) / 2, y: (innerHeight - SIZE) / 2 } : home(); // just signed in: centre, see welcome()
pos.x = h0.x; pos.y = h0.y; place();
loop("Idle_Hover");
if (!window.maxJustIn) doze(); // asleep since last time (after a sign-in he wakes for the welcome first)
requestAnimationFrame(frame);
addEventListener("resize", () => { if (!flight && mode === "idle" && !homeOverride) { const h = home(); pos.x = h.x; pos.y = h.y; place(); } });

// ---- the portal talks to Max through this ----
window.MaxBot = {
  listen, think, greet, say, goHome,
  talk(text) { talk(text); },
  // the panel opened / closed: dock next to it or back to the corner
  dock() { if (!homeOverride && !sleeping) goHome(); },
  // just signed in: he starts in the middle of the screen, salutes and says hello, then flies to his corner
  // (dozes off there if "Max sleeps" is on)
  welcome(name) {
    homeOverride = null; rouse();
    play("Greet_Salute", { once: true, then: () => loop("Idle_Hover") });
    say(`Welcome back${name ? ", " + name : ""}!`, 3000);
    setTimeout(() => goHome(doze), 3500);
  },
  // after an answer: point at the first device / ticket it mentions if it is on the page
  answered(text, proposals) {
    talk(text);
    const code = /\[\[device:(\d{4})\]\]/.exec(text)?.[1], d = code && S.devices.find(x => x.code === code);
    const target = d && document.querySelector(`#view a[href="#/device/${CSS.escape(encodeURIComponent(d.id))}"], #view [data-id="${CSS.escape(d.id)}"]`);
    if (proposals?.length) setTimeout(() => pointAt(document.querySelector("#maxLog [data-go]"), "Press Confirm if that's right.", { stay: true, ms: 5000 }), 900);
    else if (target && moves) setTimeout(() => pointAt(target, `${d.code} · ${label(d)}`), 1200);
  },
  alert(target, text) { rouse(); if (moves) pointAt(target, text, { alert: true, tone: "bad", ms: 7000, stay: true }); else say(text, 7000, "bad"); },
  tip(target, text) { if (!tourOn && !sleeping && moves && text) pointAt(target, text, { ms: 5500, stay: true }); },
  announce(text, { ms = 12000, tone = "", onClick } = {}) {
    clearTimeout(pointTimer);
    holderFace = 0;
    rouse();
    flyTo((innerWidth - SIZE) / 2, (innerHeight - SIZE) / 2, () => {
      say(text, ms, (tone + " announce").trim());
      bubble.onclick = () => { bubble.hidden = true; onClick?.(); };
      play("T_Fly_To_Alert", { once: true, then: () => loop("Alert_Critical_Wave") });
      mode = "point";
      pointTimer = setTimeout(() => { bubble.onclick = () => (bubble.hidden = true); goHome(doze); }, ms);
    });
  },
  pointAt, flyTo,
  // Guided tour: Overview and every menu page (opened one by one), then the top bar last. The next step waits until he
  // has finished speaking. Opening another page meanwhile: he explains that page, then resumes the tour. Clicking Max stops it.
  tour() {
    T = { i: 0, expect: "", steps: [
      ...[...document.querySelectorAll("#nav a")].map(a => ({ href: a.getAttribute("href"), text: TOUR[a.getAttribute("href").slice(2)] })).filter(x => x.text),
      ...TOUR_HEADER.filter(([sel]) => document.querySelector(sel)).map(([sel, text]) => ({ sel, text })),
    ] };
    tourOn = true;
    tourStep();
  },
  stopTour,
  get sleeping() { return sleeping; },
  set sleeping(v) { setSleep(!!v); },
  get moves() { return moves; },
  set moves(v) { moves = v; try { localStorage.setItem("maxMoves", v ? "on" : "off"); } catch {} if (!v) { homeOverride = null; goHome(); } },
};
let touring = 0, tourOn = false, T = null; // T: the running tour { steps, i, expect }; tourOn: page tips stay quiet
function stopTour() { touring++; tourOn = false; T = null; }
// Waits until he has spoken (and at least ms), unless something newer (token) took over.
function tourWait(token, ms, then) {
  const t0 = Date.now();
  const tick = () => token !== touring ? null
    : Date.now() - t0 < ms || window.speechSynthesis?.speaking || window.speechSynthesis?.pending ? setTimeout(tick, 300) : then();
  setTimeout(tick, 800);
}
const tourMs = text => 1500 + text.length * 70;
function tourStep(intro = "") {
  if (!T) return;
  const token = ++touring;
  if (T.i >= T.steps.length) { stopTour(); location.hash = "#/overview"; T = null; return goHome(() => say("That's the tour! Click me any time and just ask.", 5000)); }
  const st = T.steps[T.i], text = intro + st.text;
  const show = el => { pointAt(el, text, { ms: tourMs(text) + 6000, stay: !st.href }); tourWait(token, tourMs(text), () => { if (T) { T.i++; tourStep(); } }); };
  if (!st.href) { T.expect = location.hash; return show(document.querySelector(st.sel)); }
  T.expect = st.href;
  if (location.hash !== st.href) location.hash = st.href; // open the page
  setTimeout(() => token === touring && show(document.querySelector("#view h2") || document.querySelector(`#nav a[href="${st.href}"]`)), 900);
}
// During the tour the user opened another page: explain that one, then go back to where the tour was.
addEventListener("hashchange", () => {
  if (!T || location.hash === T.expect) return;
  const token = ++touring, page = location.hash.slice(2).split("/")[0];
  window.speechSynthesis?.cancel();
  T.expect = location.hash;
  const text = TOUR[page] ? "You opened this one. " + TOUR[page] : "";
  if (!text) return tourStep("Back to the tour. "); // a page without a tour text (a device, a ticket): carry on
  setTimeout(() => {
    if (token !== touring) return;
    pointAt(document.querySelector("#view h2") || document.querySelector(`#nav a[href="#/${page}"]`), text, { ms: tourMs(text) + 6000 });
    tourWait(token, tourMs(text), () => tourStep("Now, back to the tour. "));
  }, 900);
});
// top bar, explained last, in this order
const TOUR_HEADER = [
  ["#themeBtn", "Up here in the top bar: this button switches the theme between light, dark and automatic."],
  ["#soundBtn", "The speaker turns the alarm sound on or off. The alarm plays while an alert is open."],
  ["#mapBtn", "The Map shows where every device is, with a filter for sites and a search for device names."],
  ["a.bell", "The bell shows how many alerts are open. Click it to go straight to the alerts."],
  ["#who", "And this is your profile, the signed-in account. Sign out is right next to it."],
];
const TOUR = {
  overview: "This is the Overview: total devices, how many are online and offline, devices per site and type, and the open alerts. You can also turn maintenance mode on or off for all devices here.",
  devices: "This is Devices: every tablet and terminal. Search and filter them, tick several to send one command to all, or click a row to open the device page with its health, commands and logs.",
  sites: "These are the Sites: your buildings. Each site card shows its devices and how many are offline. Give every site an address and coordinates so I can find technicians nearby.",
  alerts: "This is Alerts: devices offline, low battery and app crashes. Acknowledge stops the alarm, and an alert clears itself when the device recovers.",
  team: "This is the Technical Team: tickets, technicians, who is available, the workload, and the settings for automatic tickets and auto-assign.",
  tasks: "Scheduled tasks run a command at a set time on chosen days, for example restarting a site every night.",
  apps: "Apps and files: upload an app or a file once, then install or send it to many devices at the same time.",
  enroll: "Enroll devices makes a QR code to set up new tablets after a factory reset.",
  announcements: "Announcements show a full screen message on the tablets until someone taps Acknowledge.",
  activity: "The Activity log lists everything that happened, who did it and when.",
  users: "Users and access: create portal logins and choose what each person can see and do.",
};
window.dispatchEvent(new Event("maxbot-ready"));
</script>
</body>

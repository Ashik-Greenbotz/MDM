<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1d2129; --muted: #6b7280; --line: #e6e8eb; --hover: #f8f9fa;
    --accent: #f28c00; --accent-soft: #fff3e0; --accent-ink: #ffffff;
    --ok: #1e8e3e; --ok-soft: #e6f4ea; --bad: #d93025; --bad-soft: #fce8e6; --warn: #b06000; --warn-soft: #fef7e0;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --card: #1b1e24; --text: #e8eaed; --muted: #9aa0a6; --line: #2c3038; --hover: #22262d;
      --accent-soft: #3a2a12; --ok: #5bb974; --ok-soft: #1f3326; --bad: #ef7070; --bad-soft: #3b2121;
      --warn: #fdd663; --warn-soft: #3a3214; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  button { font: inherit; cursor: pointer; }

  header { position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 12px; padding: 10px 20px;
    background: var(--card); border-bottom: 1px solid var(--line); }
  header img { width: 40px; height: 40px; object-fit: contain; border-radius: 8px; background: #fff; }
  header h1 { font-size: 17px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .live.down i { background: var(--bad); }

  .wrap { padding: 20px; max-width: 1600px; margin: 0 auto; }
  .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
    text-align: left; color: inherit; }
  .stat.active { outline: 2px solid var(--accent); }
  .stat .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .stat.ok .n { color: var(--ok); } .stat.bad .n { color: var(--bad); } .stat.warn .n { color: var(--warn); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .toolbar { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 160px; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); }
  .table-wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 200px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--card); color: var(--muted); font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; z-index: 1; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  tbody tr.sel { background: var(--accent-soft); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.neutral { color: var(--muted); background: var(--hover); }
  .batt { display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
  .batt .bar { width: 36px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .batt .bar b { display: block; height: 100%; background: var(--ok); }
  .batt.low .bar b { background: var(--bad); }
  .actions { display: flex; gap: 6px; }
  .btn { padding: 5px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-size: 13px; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.ghost { border-color: transparent; color: var(--muted); }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }

  #map { height: calc(100vh - 210px); min-height: 360px; }
  .leaflet-popup-content { font: 13px/1.45 system-ui, sans-serif; }
  .leaflet-popup-content .name { font-size: 14px; }

  .menu { position: fixed; z-index: 2000; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,.15); padding: 4px; min-width: 150px; }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; color: var(--text); border-radius: 6px; }
  .menu button:hover { background: var(--hover); }
  .menu button.danger { color: var(--bad); }

  #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 3000; display: grid; gap: 8px; }
  .toast { background: #1d2129; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
    font-size: 14px; animation: in .2s ease-out; }
  .toast.err { background: var(--bad); }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } }
  header h1, .btn { white-space: nowrap; }
  @media (max-width: 600px) {
    header { padding: 10px 16px; } .wrap { padding: 16px; } header .sub, #liveText { display: none; }
    .table-wrap { min-height: 0; }
  }
</style>
</head>
<body>
<header>
  <img src="/logo.png" alt="">
  <div>
    <h1>Kiosk Dashboard</h1>
    <div class="sub">Interlock Group · tablets across all sites</div>
  </div>
  <div class="grow"></div>
  <span class="live" id="live"><i></i><span id="liveText">Connecting…</span></span>
  <button class="btn" id="logout">Sign out</button>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by name, model or serial…">
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Device</th><th>Status</th><th>Kiosk</th><th>Battery</th><th>Last seen</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="empty" hidden></div>
      </div>
    </div>
    <div class="card"><div id="map"></div></div>
  </div>
</div>
<div id="toasts"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ONLINE_MS = 60 * 1000;  // tablets check in every 10s
const LOW_BATTERY = 20;
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const map = L.map("map").setView([1.3521, 103.8198], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);

let devices = [], markers = {}, selected = null, skew = 0, fitted = false, filter = "all";

const now = () => Date.now() + skew;  // server clock, so "last seen" is right even if this PC's clock is off
const isOnline = d => d.lastSeen && now() - d.lastSeen < ONLINE_MS;
const label = d => d.name || d.deviceName || d.id.slice(0, 8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const ago = t => {
  if (!t) return "never";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(t).toLocaleString();
};

const FILTERS = {
  all:      { label: "Total devices", cls: "",     test: () => true },
  online:   { label: "Online",        cls: "ok",   test: d => isOnline(d) },
  offline:  { label: "Offline",       cls: "bad",  test: d => !isOnline(d) },
  unlocked: { label: "Unlocked",      cls: "warn", test: d => d.kioskLocked === false },
  low:      { label: "Low battery",   cls: "warn", test: d => d.battery != null && d.battery < LOW_BATTERY },
};

function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("toasts").append(t);
  setTimeout(() => t.remove(), 3500);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
  return r.json();
}

async function refresh() {
  try {
    const r = await api("/api/devices");
    skew = r.now - Date.now();
    devices = r.devices.sort((a, b) => label(a).localeCompare(label(b)));
    $("live").classList.remove("down");
    $("liveText").textContent = "Live · updated " + new Date().toLocaleTimeString();
    render();
  } catch (e) {
    $("live").classList.add("down");
    $("liveText").textContent = "Server unreachable";
  }
}

function render() {
  $("stats").innerHTML = Object.entries(FILTERS).map(([k, f]) =>
    `<button class="stat ${f.cls} ${filter === k ? "active" : ""}" data-filter="${k}">
       <div class="n">${devices.filter(f.test).length}</div><div class="l">${f.label}</div></button>`).join("");

  const q = $("search").value.trim().toLowerCase();
  const shown = devices.filter(FILTERS[filter].test).filter(d =>
    !q || [label(d), d.model, d.serial, d.deviceName].some(v => String(v ?? "").toLowerCase().includes(q)));

  $("rows").innerHTML = shown.map(d => {
    const on = isOnline(d), low = d.battery != null && d.battery < LOW_BATTERY;
    const kiosk = d.command
      ? `<span class="pill neutral">Sending ${esc(d.command.type)}…</span>`
      : d.kioskLocked === false ? `<span class="pill warn"><i></i>Unlocked</span>` : `<span class="pill ok"><i></i>Locked</span>`;
    return `<tr data-id="${esc(d.id)}" class="${d.id === selected ? "sel" : ""}">
      <td><div class="name">${esc(label(d))}</div><div class="meta">${esc(d.model)}${d.serial ? " · " + esc(d.serial) : ""}</div></td>
      <td><span class="pill ${on ? "ok" : "bad"}"><i></i>${on ? "Online" : "Offline"}</span></td>
      <td>${kiosk}</td>
      <td>${d.battery == null ? "–" : `<span class="batt ${low ? "low" : ""}"><span class="bar"><b style="width:${d.battery}%"></b></span>${d.battery}%${d.charging ? " ⚡" : ""}</span>`}</td>
      <td><span title="${d.lastSeen ? new Date(d.lastSeen).toLocaleString() : ""}">${ago(d.lastSeen)}</span></td>
      <td><div class="actions">
        <button class="btn primary" data-cmd="unlock" title="Unlock for 2 minutes">Unlock</button>
        <button class="btn" data-cmd="lock">Lock</button>
        <button class="btn ghost" data-menu aria-label="More">⋯</button>
      </div></td>
    </tr>`;
  }).join("");

  $("empty").hidden = shown.length > 0;
  $("empty").textContent = devices.length === 0
    ? "No tablets yet. They appear here as soon as the kiosk app checks in."
    : "No tablets match this filter.";

  const seen = new Set();
  for (const d of devices) {
    if (d.lat == null) continue;
    seen.add(d.id);
    const color = isOnline(d) ? css("--ok") : css("--bad");
    const popup = `<div class="name">${esc(label(d))}</div>
      ${isOnline(d) ? "Online" : "Offline"} · battery ${d.battery ?? "?"}%<br>
      <span class="meta">Location ±${Math.round(d.accuracy || 0)} m · ${ago(d.locationTime)}</span>`;
    if (!markers[d.id]) {
      markers[d.id] = L.circleMarker([d.lat, d.lng], { radius: 9, weight: 3, fillOpacity: .9 }).addTo(map)
        .on("click", () => { selected = d.id; render(); });
    }
    markers[d.id].setLatLng([d.lat, d.lng]).setStyle({ color: "#fff", fillColor: color })
      .setRadius(d.id === selected ? 12 : 9).bindPopup(popup);
  }
  for (const id in markers) if (!seen.has(id)) { markers[id].remove(); delete markers[id]; }
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!fitted && pts.length) { map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 16 }); fitted = true; }
}

async function command(d, type) {
  if (!isOnline(d) && !confirm(`${label(d)} is offline. Send anyway? It runs when the tablet reconnects.`)) return;
  try {
    await api(`/api/devices/${d.id}/command`, { type });
    toast(type === "unlock" ? `Unlocking ${label(d)} for 2 minutes…` : `Locking ${label(d)}…`);
  } catch (e) { toast("Failed: " + e.message, true); }
  refresh();
}

function closeMenu() { document.querySelector(".menu")?.remove(); }
function openMenu(btn, d) {
  closeMenu();
  const m = document.createElement("div");
  m.className = "menu";
  m.innerHTML = `<button data-act="locate">Show on map</button><button data-act="rename">Rename</button>
    <button data-act="delete" class="danger">Remove from list</button>`;
  document.body.append(m);
  const r = btn.getBoundingClientRect();
  m.style.top = Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8) + "px";
  m.style.left = Math.max(8, r.right - m.offsetWidth) + "px";
  m.onclick = async e => {
    const act = e.target.dataset.act;
    closeMenu();
    try {
      if (act === "locate") locate(d);
      if (act === "rename") {
        const name = prompt("Device name (e.g. site name):", label(d));
        if (name && name.trim()) { await api(`/api/devices/${d.id}/name`, { name }); toast("Renamed"); }
      }
      if (act === "delete" && confirm(`Remove ${label(d)} from the list? It comes back if the tablet checks in again.`)) {
        await api(`/api/devices/${d.id}/delete`, {});
        toast("Removed");
      }
    } catch (err) { toast("Failed: " + err.message, true); }
    refresh();
  };
}

function locate(d) {
  if (!markers[d.id]) { toast("No location from this tablet yet", true); return; }
  map.setView(markers[d.id].getLatLng(), 16);
  markers[d.id].openPopup();
}

$("rows").onclick = e => {
  const tr = e.target.closest("tr");
  if (!tr) return;
  const d = devices.find(x => x.id === tr.dataset.id);
  selected = d.id;
  const cmd = e.target.closest("[data-cmd]"), menu = e.target.closest("[data-menu]");
  if (cmd) command(d, cmd.dataset.cmd);
  else if (menu) { e.stopPropagation(); openMenu(menu, d); }
  else locate(d);
  render();
};
$("stats").onclick = e => {
  const b = e.target.closest("[data-filter]");
  if (b) { filter = b.dataset.filter; render(); }
};
$("search").oninput = render;
document.addEventListener("click", e => { if (!e.target.closest(".menu")) closeMenu(); });
$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login"; };

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>

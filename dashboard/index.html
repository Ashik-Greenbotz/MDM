<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device Portal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#f28c00">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  /* Theme: html[data-theme] is set before paint by the head script (auto follows the system). */
  :root {
    --bg: #f5f5f7; --card: rgba(255,255,255,.78); --solid: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: rgba(0,0,0,.08); --hover: rgba(0,0,0,.04);
    --glass: rgba(255,255,255,.7); --accent: #f28c00; --accent2: #ffb340; --accent-soft: rgba(242,140,0,.12); --accent-ink: #ffffff;
    --ok: #1f9d55; --ok-soft: rgba(31,157,85,.12); --bad: #e5383b; --bad-soft: rgba(229,56,59,.11); --warn: #b26a00; --warn-soft: rgba(255,179,64,.18);
    --shadow: 0 1px 1px rgba(0,0,0,.03), 0 8px 28px rgba(0,0,0,.06); --shadow-hi: 0 2px 4px rgba(0,0,0,.04), 0 18px 48px rgba(0,0,0,.12);
    --glow1: rgba(242,140,0,.16); --glow2: rgba(64,120,255,.12);
    --ease: cubic-bezier(.2,.8,.2,1); color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #050507; --card: rgba(28,28,32,.66); --solid: #16161a; --text: #f5f5f7; --muted: #8e8e96; --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.06);
    --glass: rgba(18,18,22,.62); --accent-soft: rgba(242,140,0,.16);
    --ok: #34d399; --ok-soft: rgba(52,211,153,.14); --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.14); --warn: #ffc94d; --warn-soft: rgba(255,201,77,.14);
    --shadow: 0 0 0 1px rgba(255,255,255,.02), 0 10px 30px rgba(0,0,0,.4); --shadow-hi: 0 0 0 1px rgba(242,140,0,.25), 0 20px 50px rgba(0,0,0,.55), 0 0 40px rgba(242,140,0,.08);
    --glow1: rgba(242,140,0,.18); --glow2: rgba(80,110,255,.16); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body { margin: 0; font: 14px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI Variable", "Segoe UI", Roboto, sans-serif;
    letter-spacing: -.01em; background: var(--bg); color: var(--text); transition: background .4s var(--ease), color .4s var(--ease); }
  /* slow-drifting light behind the glass */
  body::before { content: ""; position: fixed; inset: -20%; z-index: -1; pointer-events: none;
    background: radial-gradient(40% 35% at 20% 15%, var(--glow1), transparent 70%), radial-gradient(35% 30% at 85% 80%, var(--glow2), transparent 70%);
    animation: drift 24s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, -3%, 0) scale(1.08); } }
  button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
  button { cursor: pointer; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 10px; padding: 10px 22px;
    background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line); }
  header img { width: 38px; height: 38px; object-fit: contain; border-radius: 10px; background: #fff; box-shadow: 0 2px 10px rgba(242,140,0,.25); }
  header h1 { font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--text), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .grow { flex: 1; }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: ping 2s var(--ease) infinite; }
  .live.down i { background: var(--bad); animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(52,211,153,.55); } 80%, 100% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } }
  .bell { position: relative; }
  .bell b { position: absolute; top: -6px; right: -6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
    background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; animation: pop .4s var(--ease); }

  .layout { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: calc(100vh - 59px); }
  nav { position: sticky; top: 59px; align-self: start; height: calc(100vh - 59px); overflow-y: auto; padding: 16px 10px;
    background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-right: 1px solid var(--line); }
  nav a { position: relative; display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin-bottom: 2px; border-radius: 10px;
    color: var(--text); text-decoration: none; font-weight: 500; transition: background .2s, color .2s, transform .2s var(--ease); }
  nav a:hover { background: var(--hover); transform: translateX(2px); }
  nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav a.on::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px;
    background: linear-gradient(var(--accent), var(--accent2)); box-shadow: 0 0 12px var(--accent); }
  nav a .c { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  nav a .c.bad { color: #fff; background: var(--bad); padding: 0 7px; border-radius: 10px; font-weight: 700; }
  main { padding: 28px 32px; max-width: 1500px; width: 100%; min-width: 0; }
  main h2 { margin: 0 0 4px; font-size: 30px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
  main .lead { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
  @media (max-width: 800px) {
    .layout { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    nav { position: sticky; top: 59px; z-index: 900; height: auto; display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 6px; gap: 2px; }
    nav a { white-space: nowrap; padding: 7px 11px; margin: 0; } nav a .c, nav a.on::before { display: none; } nav a:hover { transform: none; }
    main { padding: 18px 16px; } main h2 { font-size: 24px; } header { padding: 10px 16px; gap: 8px; } header .sub, #liveText { display: none; }
    header .btn { padding: 6px 10px; }
  }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { position: relative; overflow: hidden; background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--line); border-radius: 18px; padding: 18px 18px 16px; box-shadow: var(--shadow);
    text-align: left; text-decoration: none; color: inherit; display: block; transition: transform .35s var(--ease), box-shadow .35s var(--ease), border-color .35s; }
  .stat::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.12) 50%, transparent 70%);
    transform: translateX(-100%); transition: transform .8s var(--ease); pointer-events: none; }
  a.stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-hi); border-color: rgba(242,140,0,.35); }
  a.stat:hover::after { transform: translateX(100%); }
  .stat .n { font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
  .stat.ok .n { color: var(--ok); } .stat.bad .n { color: var(--bad); } .stat.warn .n { color: var(--warn); }

  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 18px; }
  .card { background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--line);
    border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 18px; transition: box-shadow .35s var(--ease), border-color .35s; }
  .card:hover { box-shadow: var(--shadow-hi); }
  .card > h3 { margin: 0; padding: 14px 18px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .card > h3 .grow { flex: 1; }
  .pad { padding: 18px; }
  .toolbar { display: flex; gap: 8px; padding: 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
  .toolbar input[type=search] { flex: 1; min-width: 160px; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--hover); transition: border-color .2s, box-shadow .2s, background .2s; }
  input:not([type=checkbox]):not([type=radio]):not([type=file]):focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); background: var(--solid); }
  select option { background: var(--solid); color: var(--text); }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .table-wrap { overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 11px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
  th { position: sticky; top: 0; background: var(--solid); color: var(--muted); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em; z-index: 1; }
  tr:last-child td { border-bottom: 0; }
  tbody tr { transition: background .2s; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: var(--hover); }
  tbody tr.sel { background: var(--accent-soft); }
  td.wrap { white-space: normal; }
  td .row { flex-wrap: nowrap; }
  @media (max-width: 480px) { header h1 { display: none; } }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .type { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600;
    background: var(--hover); color: var(--muted); vertical-align: 1px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.neutral { color: var(--muted); background: var(--hover); }
  /* Sites page: one card per site */
  .site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 16px; margin-top: 14px; }
  .site-card { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .site-card a { color: inherit; text-decoration: none; }
  .site-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .site-head .name { font-size: 16px; font-weight: 650; }
  .site-health { display: flex; align-items: center; gap: 10px; }
  .site-health > b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .site-health .meter { flex: 1; } .site-health .meter .bar { width: 100%; }
  .site-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .site-stats div { background: var(--hover); border-radius: 10px; padding: 8px; text-align: center; }
  .site-stats b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .site-stats span { font-size: 12px; color: var(--muted); }
  .site-stats .bad b { color: var(--bad); } .site-stats .warn b { color: var(--warn); }
  .stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .health-list { display: grid; gap: 14px; } .health-list .hbar { margin: 6px 0 4px; }
  .meter { display: inline-flex; align-items: center; gap: 7px; font-variant-numeric: tabular-nums; font-size: 13px; }
  .meter .bar { width: 38px; height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .meter .bar b { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ok), #6ee7b7); }
  .meter.warn .bar b { background: linear-gradient(90deg, var(--warn), var(--accent2)); } .meter.bad .bar b { background: linear-gradient(90deg, var(--bad), #ff9a9a); }
  .btn { padding: 7px 14px; border-radius: 980px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap;
    transition: transform .2s var(--ease), background .2s, box-shadow .25s var(--ease), border-color .2s; }
  a.btn { color: inherit; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--hover); border-color: rgba(127,127,127,.25); }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: var(--accent-ink); font-weight: 600;
    box-shadow: 0 4px 14px rgba(242,140,0,.3); }
  .btn.primary:hover { box-shadow: 0 6px 22px rgba(242,140,0,.45); transform: translateY(-1px); }
  .btn.danger { color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }
  .bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
  form.grid { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 14px; align-items: center; }
  form.grid label { color: var(--muted); }
  @media (max-width: 600px) { form.grid { grid-template-columns: 1fr; } }
  .days label { margin-right: 8px; white-space: nowrap; color: var(--text) !important; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; font-weight: 500; }
  .chart { width: 100%; height: 160px; display: block; }
  #view.enter .chart polyline { stroke-dasharray: 3000; animation: draw 1.6s var(--ease); }
  .chart polyline { filter: drop-shadow(0 2px 6px rgba(0,0,0,.15)); }
  @keyframes draw { from { stroke-dashoffset: 3000; } }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); padding: 0 18px 14px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
  pre.log { margin: 0; padding: 14px 18px; max-height: 480px; overflow: auto; font: 12px/1.6 ui-monospace, "SF Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .qr { background: #fff; padding: 12px; border-radius: 14px; display: inline-block; }
  .qr svg { display: block; width: 280px; height: 280px; }
  .feat td:first-child { white-space: normal; }
  .code { font: 700 13px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .08em; padding: 4px 8px; border-radius: 7px;
    background: var(--accent-soft); color: var(--accent); }
  tr.pending td { color: var(--muted); }
  .bigcode { font: 700 54px/1 ui-monospace, "SF Mono", Consolas, monospace; letter-spacing: .15em; text-align: center; color: var(--accent);
    background: var(--accent-soft); border-radius: 16px; padding: 18px; margin: 10px 0; }
  .donut-wrap { display: flex; align-items: center; gap: 28px; padding: 20px; flex-wrap: wrap; }
  .donut { width: 180px; height: 180px; flex: none; }
  .donut text { fill: var(--text); }
  .donut circle + circle { filter: drop-shadow(0 0 4px var(--ok-soft)); }
  .legend2 { display: grid; gap: 10px; font-size: 14px; }
  .legend2 i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 8px; vertical-align: -1px; }
  .hbar { display: flex; height: 8px; border-radius: 5px; overflow: hidden; background: var(--line); min-width: 120px; }
  .hbar b { background: linear-gradient(90deg, var(--ok), #6ee7b7); } .hbar s { background: var(--bad); text-decoration: none; }
  .alarm { display: flex; align-items: center; gap: 12px; padding: 13px 18px; margin-bottom: 18px; border-radius: 16px;
    background: linear-gradient(135deg, #e5383b, #ff6b6b); color: #fff; font-weight: 600; box-shadow: 0 8px 30px rgba(229,56,59,.35);
    animation: pulse 1.6s ease-in-out infinite; }
  .alarm .grow { flex: 1; }
  .alarm .btn { background: #fff; color: var(--bad); border-color: #fff; }
  .alarm.maint { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(255,179,64,.45); box-shadow: none; animation: none; flex-wrap: wrap;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .alarm.maint .btn { background: var(--card); color: var(--text); border-color: var(--line); }
  @keyframes pulse { 50% { box-shadow: 0 8px 40px rgba(229,56,59,.6); } }

  dialog { border: 1px solid var(--line); border-radius: 22px; background: var(--solid); color: var(--text); padding: 24px;
    width: min(520px, calc(100vw - 32px)); box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  dialog[open] { animation: zoom .35s var(--ease); }
  dialog::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); animation: fade .3s; }
  dialog h2 { margin: 0 0 14px; font-size: 20px; letter-spacing: -.02em; }
  dialog .foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  #shotDlg { width: min(760px, calc(100vw - 24px)); }
  #shotDlg h2 .code { font-size: 13px; vertical-align: middle; }
  img.shot { display: block; max-width: 100%; max-height: calc(100vh - 230px); margin: 0 auto; border-radius: 14px; border: 1px solid var(--line); background: #000;
    box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: zoom .5s var(--ease); }
  .shot-msg { text-align: center; padding: 32px 8px 8px; }
  .shot-msg p { max-width: 420px; margin: 8px auto 0; }
  .spin { width: 42px; height: 42px; margin: 0 auto 16px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .9s linear infinite; box-shadow: 0 0 24px var(--accent-soft); }
  @keyframes spin { to { transform: rotate(360deg); } }
  #mapDlg { width: min(1300px, calc(100vw - 24px)); height: min(860px, calc(100vh - 24px)); padding: 0; overflow: hidden; }
  #mapDlg .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  #mapDlg .bar h2 { margin: 0; flex: 1; font-size: 16px; }
  #map { height: calc(100% - 53px); }
  .leaflet-popup-content { font: 13px/1.45 -apple-system, "Segoe UI", sans-serif; }

  .menu { position: fixed; z-index: 2000; background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-hi); padding: 5px; min-width: 190px; transform-origin: top right; animation: zoom .2s var(--ease); }
  .menu button { display: block; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; border-radius: 8px; transition: background .15s; }
  .menu button:hover { background: var(--accent); color: #fff; }
  .menu button.danger { color: var(--bad); }
  .menu button.danger:hover { background: var(--bad); color: #fff; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px; }
  #toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 3000; display: grid; gap: 8px; }
  .toast { background: rgba(29,29,31,.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); color: #fff; padding: 11px 18px; border-radius: 980px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3); animation: rise .35s var(--ease); font-weight: 500; }
  .toast.err { background: rgba(229,56,59,.92); }

  /* motion: plays once when a page opens (route adds .enter), not on the 5 s live refresh */
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @keyframes zoom { from { opacity: 0; transform: scale(.94); } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(0); } }
  #view.enter > *, #view.enter .stats > *, #view.enter .cols > * { animation: rise .6s var(--ease) both; }
  #view.enter .stats > *:nth-child(2) { animation-delay: .05s; } #view.enter .stats > *:nth-child(3) { animation-delay: .1s; }
  #view.enter .stats > *:nth-child(4) { animation-delay: .15s; } #view.enter .stats > *:nth-child(5) { animation-delay: .2s; }
  #view.enter .stats > *:nth-child(6) { animation-delay: .25s; } #view.enter .stats > *:nth-child(n+7) { animation-delay: .3s; }
  #view.enter > *:nth-child(2) { animation-delay: .04s; } #view.enter > *:nth-child(3) { animation-delay: .08s; }
  #view.enter > *:nth-child(4) { animation-delay: .14s; } #view.enter > *:nth-child(n+5) { animation-delay: .2s; }
  #view.enter .cols > *:nth-child(2) { animation-delay: .1s; }
  #view.enter .donut circle + circle { animation: ring 1.2s var(--ease) both .2s; }
  @keyframes ring { from { stroke-dasharray: 0 999; } }
  .theme-btn { min-width: 38px; }

x1=\"16\" x2=\"22\" y1=\"9\" y2=\"15\"/>"};
const ico = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;
const PAGES = [
  ["overview", "layout-dashboard", "Overview"], ["devices", "tablet-smartphone", "Devices"], ["sites", "map-pin", "Sites"], ["alerts", "bell", "Alerts"],
  ["tasks", "calendar-clock", "Scheduled tasks"], ["apps", "package", "Apps & files"], ["enroll", "qr-code", "Enroll devices"],
  ["activity", "activity", "Activity log"], ["features", "sparkles", "Features"], ["users", "users", "Users & access"],
];
// What the signed-in account may open (server enforces the same; this only hides what would be refused).
const me = () => S.me || { admin: true, modules: PAGES.map(p => p[0]) };
const canOpen = page => page === "users" ? me().admin : me().admin || me().modules.includes({ device: "devices", site: "sites" }[page] || page);

let S = { devices: [], alerts: [], tasks: [], tokens: [], apps: [], files: [], sites: [], pending: [], commands: {} };
let skew = 0, picked = new Set(), filters = { q: "", type: "", group: "", status: "" };
const now = () => Date.now() + skew;  // server clock, so "last seen" is right even if this PC's clock is off
const isOnline = d => d.lastSeen && now() - d.lastSeen < ONLINE_MS;
const label = d => d.name || d.deviceName || d.id.slice(0, 8);
const dev = id => S.devices.find(d => d.id === id);
// Sites (stored as d.group): every saved site, plus "" (no site) if any device has none.
const groups = () => [...new Set([...S.sites.map(x => x.name), ...S.devices.map(d => d.group || "")])].sort((a, b) => a ? b ? a.localeCompare(b) : -1 : 1);
const openAlerts = () => S.alerts.filter(a => !a.resolvedAt && !a.ackAt);
const ago = t => {
  if (!t) return "never";
  const s = Math.max(0, Math.round((now() - t) / 1000));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return new Date(t).toLocaleString();
};
const fmtUptime = s => s == null ? "–" : s < 3600 ? Math.round(s / 60) + " min" : s < 86400 ? Math.round(s / 3600) + " h" : Math.round(s / 86400) + " days";
const fmtSize = b => b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
const statusPill = d => isOnline(d) ? `<span class="pill ok"><i></i>Online</span>` : `<span class="pill bad"><i></i>Offline</span>`;
const meter = (v, warnAt, badAt, suffix = "%", invert = false) => {
  if (v == null) return `<span class="meta">–</span>`;
  const lvl = invert ? (v < badAt ? "bad" : v < warnAt ? "warn" : "") : (v >= badAt ? "bad" : v >= warnAt ? "warn" : "");
  return `<span class="meter ${lvl}"><span class="bar"><b style="width:${Math.min(100, Math.max(0, v))}%"></b></span>${v}${suffix}</span>`;
};
const batt = d => d.battery == null ? `<span class="meta">–</span>` : meter(d.battery, 40, LOW_BATTERY, "%", true) + (d.charging ? " ⚡" : "");
const withUnpin = cmds => cmds.includes("singleapp") ? [...cmds.flatMap(c => c === "singleapp" ? [c, "unpin"] : [c]), "maintOn", "maintOff"] : cmds;
const appName = (d, pkg) => (d.launcherApps || []).find(a => a[0] === pkg)?.[1] || pkg;
const stateCell = d => (d.maintenance ? `<span class="pill warn" title="Showing the System Maintenance screen">🛠 Maintenance</span> ` : "") + stateCell1(d);
const stateCell1 = d => d.pending ? `<span class="pill neutral">Sending ${esc((CMD[d.pending] || d.pending).replace("…", ""))}…</span>`
  : d.type !== "android-kiosk" ? `<span class="meta">${d.uptime != null ? "Up " + fmtUptime(d.uptime) : "Monitored"}</span>`
  : d.kioskLocked === false ? `<span class="pill warn"><i></i>Unlocked</span>`
  : d.singleApp ? `<span class="pill ok" title="App pinned"><i></i>📌 ${esc(appName(d, d.singleApp))}</span>` : `<span class="pill ok"><i></i>Locked</span>`;
const options = (list, sel) => list.map(([v, t]) => `<option value="${esc(v)}" ${v === sel ? "selected" : ""}>${esc(t)}</option>`).join("");
const groupName = g => g || "No site";

function toast(msg, err) {
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.textContent = msg;
  $("toasts").append(t);
  setTimeout(() => t.remove(), 3500);
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (r.status === 401) { location.href = "/login"; throw new Error("Signed out"); }
  const ct = r.headers.get("content-type") || "";
  const data = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(data.error || "HTTP " + r.status);
  return data;
}
const act = async (fn, okMsg) => {
  try { const r = await fn(); if (okMsg) toast(typeof okMsg === "function" ? okMsg(r) : okMsg); }
  catch (e) { toast("Failed: " + e.message, true); }
  await refresh();
};

// ---------------- data + routing ----------------
async function refresh() {
  try {
    const r = await api("/api/state");
    skew = r.now - Date.now();
    r.devices.sort((a, b) => label(a).localeCompare(label(b)));
    S = r;
    $("live").classList.remove("down");
    $("liveText").textContent = "Live · " + new Date().toLocaleTimeString();
  } catch (e) {
    $("live").classList.add("down");
    $("liveText").textContent = "Server unreachable";
    return;
  }
  for (const id of picked) if (!dev(id)) picked.delete(id);
  const n = openAlerts().length;
  $("bellN").hidden = !n;
  $("bellN").textContent = n;
  $("who").innerHTML = S.me ? `${ico("user-round")}<span class="t">${esc(S.me.name || S.me.username)}</span>${S.me.readOnly ? `<span class="pill neutral">View only</span>` : ""}` : "";
  $("who").title = S.me ? `Signed in as ${S.me.username}${S.me.admin ? " (administrator)" : ""}` : "";
  renderNav();
  renderAlarm();
  renderMaint();
  route(true);
  if ($("mapDlg").open) drawMap();
}

// ---------------- offline alarm ----------------
// Sounds while any offline alert is open and not acknowledged; again for every new one. Browsers only allow sound
// after the user has clicked somewhere on the page once, so the first click (any click) unlocks it.
let audio, soundOn = true, lastAlarmAt = 0, alarmIds = "";
try { soundOn = localStorage.getItem("alarmSound") !== "off"; } catch {}
const offlineAlerts = () => S.alerts.filter(a => a.kind === "offline" && !a.resolvedAt && !a.ackAt);
function beep() {
  try {
    audio ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t0 = audio.currentTime;
    for (let i = 0; i < 6; i++) {          // three two-tone "dee-daa" pulses, ~2 s
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = "square";
      o.frequency.value = i % 2 ? 660 : 880;
      g.gain.setValueAtTime(0.0001, t0 + i * 0.33);
      g.gain.exponentialRampToValueAtTime(0.25, t0 + i * 0.33 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.33 + 0.3);
      o.connect(g).connect(audio.destination);
      o.start(t0 + i * 0.33);
      o.stop(t0 + i * 0.33 + 0.32);
    }
  } catch {}
}
document.addEventListener("click", () => { try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {} }, { once: true });
function renderAlarm() {
  const list = offlineAlerts();
  $("soundBtn").innerHTML = ico(soundOn ? "volume-2" : "volume-x");
  $("soundBtn").title = soundOn ? "Alarm sound on (click to mute)" : "Alarm sound muted (click to turn on)";
  if (!list.length) { $("alarmBar").innerHTML = ""; alarmIds = ""; return; }
  const names = list.map(a => dev(a.deviceId)).filter(Boolean).map(label);
  $("alarmBar").innerHTML = `<div class="alarm">🚨<span class="grow">${list.length} device${list.length > 1 ? "s" : ""} offline: ${esc(names.slice(0, 5).join(", "))}${names.length > 5 ? " +" + (names.length - 5) + " more" : ""}</span>
    <a class="btn" href="#/devices" data-status="offline" id="alarmShow">Show</a><button class="btn" id="alarmAck">Acknowledge (stop alarm)</button></div>`;
  $("alarmShow").onclick = () => { filters = { q: "", type: "", group: "", status: "offline" }; };
  $("alarmAck").onclick = () => act(() => Promise.all(offlineAlerts().map(a => api(`/api/alerts/${a.id}/ack`, {}))), "Alarm acknowledged");
  const ids = list.map(a => a.id).join();
  const isNew = ids !== alarmIds && list.some(a => !alarmIds.includes(a.id));
  alarmIds = ids;
  if (soundOn && (isNew || Date.now() - lastAlarmAt > 30000)) { lastAlarmAt = Date.now(); beep(); }
}
$("soundBtn").onclick = () => {
  soundOn = !soundOn;
  try { localStorage.setItem("alarmSound", soundOn ? "on" : "off"); } catch {}
  if (soundOn) beep();
  renderAlarm();
};

function renderNav() {
  const cur = (location.hash.slice(2) || "overview").split("/")[0];
  const counts = { devices: S.devices.length, sites: groups().filter(Boolean).length, alerts: openAlerts().length, tasks: S.tasks.length };
  $("nav").innerHTML = PAGES.filter(([k]) => canOpen(k)).map(([k, icon, t]) => `<a href="#/${k}" class="${cur === k || (cur === "device" && k === "devices") || (cur === "site" && k === "sites") ? "on" : ""}">
    ${ico(icon)}<span class="t">${t}</span>${counts[k] ? `<span class="c ${k === "alerts" ? "bad" : ""}">${counts[k]}</span>` : ""}</a>`).join("");
}

// Live pages redraw every 5 s; pages with forms only redraw their lists (`live` = called from refresh).
let lastPage = "";
function route(live) {
  const [page, arg] = (location.hash.slice(2) || "overview").split("/");
  const fresh = page + "/" + arg !== lastPage;
  lastPage = page + "/" + arg;
  if (!canOpen(page || "overview")) {
    const first = PAGES.find(([k]) => canOpen(k));
    if (first && page !== first[0]) { location.hash = "#/" + first[0]; return; }
    $("view").innerHTML = `<p class="empty">Your account has no pages yet. Ask an administrator to give you access.</p>`; return;
  }
  const fn = VIEWS[page] || VIEWS.overview;
  if (!live || fresh) { renderNav(); $("view").innerHTML = ""; }
  fn(arg ? decodeURIComponent(arg) : undefined, !live || fresh);
  if (!live || fresh) enter();
}
let enterTimer;
function enter() {
  const v = $("view");
  v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
  clearTimeout(enterTimer);
  enterTimer = setTimeout(() => v.classList.remove("enter"), 1600);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (const n of v.querySelectorAll(".stat .n")) {
    const end = Number(n.textContent);
    if (!(end > 0)) continue;
    const t0 = performance.now();
    const step = t => { const p = Math.min(1, (t - t0) / 700); n.textContent = Math.round(end * (1 - (1 - p) ** 3)); if (p < 1 && n.isConnected) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
}
window.onhashchange = () => route(false);

// ---------------- views ----------------
const VIEWS = {};

// Fleet state per device, most important first: maintenance, offline, warning (online but low battery
// or an unlocked kiosk), online. Used by the dashboard and the Sites cards.
const fleetState = d => d.maintenance ? "maintenance" : !isOnline(d) ? "offline"
  : (d.battery != null && d.battery < LOW_BATTERY) || (d.type === "android-kiosk" && d.kioskLocked === false) ? "warning" : "online";
const FLEET = [["online", "Online", "--ok"], ["warning", "Warning", "--warn"], ["offline", "Offline", "--bad"], ["maintenance", "Maintenance", "--muted"]];
function siteStats(g) {
  const list = S.devices.filter(d => (d.group || "") === g), ids = new Set(list.map(d => d.id));

  const on = list.filter(isOnline).length, alerts = openAlerts().filter(a => ids.has(a.deviceId)).length;
  // Fleet health = share of the site's devices online. Attention below 90% or with open alerts.
  const health = list.length ? Math.round(1000 * on / list.length) / 10 : null;
  const status = health == null ? ["neutral", "No devices"] : health < 50 ? ["bad", "Critical"] : health < 90 || alerts ? ["warn", "Attention"] : ["ok", "Healthy"];
  return { list, n, on, off: list.length - on, alerts, health, status };
}

// Ring with one segment per fleet state (n = { online, warning, offline, maintenance }).
function donut(n, total) {
  const r = 70, c = 2 * Math.PI * r, pct = v => total ? Math.round(1000 * v / total) / 10 : 0;
  let start = 0;
  const segs = FLEET.filter(([k]) => n[k]).map(([k, , col]) => {
    const len = c * n[k] / total, s = `<circle cx="90" cy="90" r="${r}" fill="none" stroke="${css(col)}" stroke-width="22"
      stroke-dasharray="${len} ${c}" stroke-dashoffset="${-start}" transform="rotate(-90 90 90)"/>`;
    start += len;
    return s;
  });
  return `<div class="donut-wrap"><svg class="donut" viewBox="0 0 180 180">
      <circle cx="90" cy="90" r="${r}" fill="none" stroke="${css("--line")}" stroke-width="22"/>${segs.join("")}
      <text x="90" y="88" text-anchor="middle" font-size="34" font-weight="700">${Math.round(pct(n.online + n.warning))}%</text>
      <text x="90" y="112" text-anchor="middle" font-size="13" opacity=".65">online</text></svg>
    <div class="legend2">${FLEET.map(([k, name, col]) => `<div><i style="background:${css(col)}"></i><b>${n[k]}</b> ${name} <span class="meta">(${pct(n[k])}%)</span></div>`).join("")}
      <div class="meta">${total} devices in total</div></div></div>`;
}

function deviceMenu(btn, d) {

function deviceAction(d, a) {

  }
  if (a === "group") askGroup(label(d), d.group || "", g => act(() => api(`/api/devices/${d.id}/group`, { group: g }), "Moved"));
  if (a === "delete" && confirm(`Remove ${label(d)} from the portal? It comes back if it checks in again.`)) {
    act(() => api(`/api/devices/${d.id}/delete`, {}), "Removed").then(() => { if (location.hash.startsWith("#/device/")) location.hash = "#/devices"; });
  }
}

// Sends one command to a list of devices. install / file ask which app / file first.
// Screenshot popup. t0 = server time the request was sent; null = just show the last screenshot.
let shotTimers = [];
async function screenshot(d, send = true) {
  const dl = $("shotDlg"), t0 = send ? now() : null;
  shotTimers.forEach(clearInterval);
  shotTimers = [];
  dl.onclose = () => { shotTimers.forEach(clearInterval); shotTimers = []; };
  dl.onclick = e => {
    const b = e.target.closest("[data-shot]");
    if (b?.dataset.shot === "again") screenshot(dev(d.id) || d);
    if (b?.dataset.shot === "close") dl.close();
  };
  let sendError = "", shown = "";
  const render = () => {
    const x = dev(d.id) || d, secs = t0 ? Math.round((now() - t0) / 1000) : 0;
    const again = `<button class="btn primary" data-shot="again">📸 ${t0 ? "Try again" : "Take new screenshot"}</button>`;
    let state, body;
    if (t0 == null || x.screenshotAt > t0) {
      const at = x.screenshotAt, src = `/api/devices/${encodeURIComponent(x.id)}/screenshot.jpg?t=${at}`;
      const file = `${x.code || x.id}-${new Date(at - new Date(at).getTimezoneOffset() * 6e4).toISOString().slice(0, 19).replace(/\D/g, "")}.jpg`;
      state = "img" + at;
      body = at ? `<a href="${src}" target="_blank" rel="noopener"><img class="shot" src="${src}" alt="Screenshot of ${esc(label(x))}"></a>
        <p class="meta" style="text-align:center">${new Date(at).toLocaleString()}${t0 ? ` · took ${Math.max(1, Math.round((at - t0) / 1000))} s` : ` · ${ago(at)}`}</p>
        <div class="foot">${again.replace("Try again", "Take again")}<a class="btn" href="${src}" download="${esc(file)}">Download</a>
          <a class="btn" href="${src}" target="_blank" rel="noopener">Open full size</a><button class="btn" data-shot="close">Close</button></div>`
        : `<p class="empty">No screenshot yet.</p><div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else if (sendError || x.screenshotError?.at > t0) {
      state = "err";
      body = `<div class="shot-msg"><div style="font-size:40px">⚠️</div><b>Couldn't take the screenshot</b>
        <p class="meta">${esc(sendError || x.screenshotError.text)}</p></div><div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else if (secs >= 60) {
      state = "timeout";
      body = `<div class="shot-msg"><div style="font-size:40px">⏳</div><b>No screenshot after a minute</b>
        <p class="meta">${isOnline(x) ? `${esc(label(x))} may be busy, or someone needs to tap <b>Start now</b> on its screen the first time.`
          : `${esc(label(x))} is offline. The request stays queued and runs when it reconnects.`}</p></div>
        <div class="foot"><button class="btn" data-shot="close">Close</button>${again}</div>`;
    } else {
      state = "wait";
      body = `<div class="shot-msg"><div class="spin"></div><b>Waiting for ${esc(label(x))}… ${secs} s</b>
        <p class="meta">${isOnline(x) ? "Usually 3–20 seconds. The first time on older Android, someone may need to tap <b>Start now</b> on the device."
          : `⚠️ ${esc(label(x))} is offline (last seen ${ago(x.lastSeen)}). The request is queued and runs when it reconnects.`}</p></div>
        <div class="foot"><button class="btn" data-shot="close">Close</button></div>`;
    }
    if (state === shown && state !== "wait") return;
    shown = state;
    dl.innerHTML = `<h2>📸 ${esc(label(x))} <span class="code">${esc(x.code || "")}</span></h2>${body}`;
    if (state !== "wait") { shotTimers.forEach(clearInterval); shotTimers = []; }
  };
  render();
  if (!dl.open) dl.showModal();
  if (!t0) return;
  shotTimers = [setInterval(render, 1000), setInterval(() => refresh().then(render), 1500)];
  try { await api(`/api/devices/${d.id}/command`, { type: "screenshot" }); }
  catch (e) { sendError = e.message; render(); }
}

// target: same shape as /api/bulk ({ids} | {all:true} ...); n = how many devices, for the confirm text.
function maintenance(target, on, n) {
  if (on && n > 1 && !confirm(`Show the maintenance screen on ${n} devices?`)) return;
  return act(() => api("/api/maintenance", { target, on }), r => `Maintenance ${on ? "on" : "off"} for ${r.count} device${r.count === 1 ? "" : "s"}`);
}
function renderMaint() {
  const n = S.devices.filter(d => d.maintenance).length;
  $("maintBar").innerHTML = n ? `<div class="alarm maint">🛠<span class="grow">${n} device${n > 1 ? "s" : ""} in maintenance (showing the System Maintenance screen)</span>
    <a class="btn" href="#/devices" id="maintShow">Show</a><button class="btn" id="maintOff">Turn all off</button></div>` : "";
  if (!n) return;
  $("maintShow").onclick = () => { filters = { q: "", type: "", group: "", status: "maintenance" }; route(false); };
  $("maintOff").onclick = () => maintenance({ all: true }, false);
}

async function command(list, type, extra = {}) {
  if (type === "maintOn" || type === "maintOff") return maintenance({ ids: list.map(d => d.id) }, type === "maintOn", list.length);
  if (type === "screenshot" && list.length === 1) return screenshot(list[0]);
  if (type === "install" && !extra.appId) return pickUpload("apps", list, type);
  if (type === "file" && !extra.fileId) return pickUpload("files", list, type);
  if (type === "singleapp" && extra.package === undefined) return pickSingleApp(list);
  if (type === "unpin") return command(list, "singleapp", { package: "", appName: "unpin" });
  const names = list.length === 1 ? label(list[0]) : list.length + " devices";
  const what = type === "singleapp" && extra.package === "" ? "Unpin app" : CMD[type].replace("…", "");
  if (type === "reboot" && !confirm(`Restart ${names}?`)) return;
  if (list.length === 1 && !isOnline(list[0]) && !confirm(`${names} is offline. Send anyway? It runs when the device reconnects.`)) return;
  if (list.length > 1 && !confirm(`Send "${what}" to ${names}?`)) return;
  await act(() => list.length === 1
      ? api(`/api/devices/${list[0].id}/command`, { type, ...extra })
      : api("/api/bulk", { target: { ids: list.map(d => d.id) }, action: "command", type, ...extra }),
    r => `${what} sent to ${r.count ?? 1} device${(r.count ?? 1) === 1 ? "" : "s"}`);
}

function pickUpload(kind, list, type) {
  const items = S[kind];
  if (!items.length) { toast(`Upload ${kind === "apps" ? "an app" : "a file"} first on the Apps & files page`, true); location.hash = "#/apps"; return; }
  dialog(`<h2>${kind === "apps" ? "Install / update app" : "Send file"}</h2>
    <p class="meta">${list.length === 1 ? esc(label(list[0])) : list.length + " devices"}. ${kind === "apps" ? "Installs silently on device-owner devices." : "Saved in the device's Download/Kiosk folder."}</p>
    <select id="upPick" style="width:100%">${options(items.map(x => [x.id, (x.label || x.name) + " · " + fmtSize(x.size)]))}</select>`,
    "Send", () => command(list, type, kind === "apps" ? { appId: $("upPick").value } : { fileId: $("upPick").value }));
}

// Apps installed on all the chosen devices (each device reports its own list).
function pickSingleApp(list) {
  const sets = list.map(d => new Map(d.launcherApps || []));
  const common = [...(sets[0] || new Map())].filter(([pkg]) => sets.every(m => m.has(pkg)));
  if (!common.length) return toast(list.length > 1 ? "These devices have no app in common" : "This device hasn't reported its apps yet (update the kiosk app)", true);
  const cur = list.length === 1 ? list[0].singleApp || "" : "";
  const anyPinned = list.some(d => d.singleApp);
  dialog(`<h2>App pinning</h2>
    <p class="meta">${list.length === 1 ? esc(label(list[0])) : list.length + " devices"}: the pinned app runs full screen, starts on boot and reopens by itself.</p>
    <select id="saPick" style="width:100%">${options(common.map(([p, n]) => [p, n]), cur)}</select>
    <p class="meta"><b>Manual override</b> (works offline): tap the bottom-left corner 6 times → PIN <b>9499</b> → the app is unpinned and the admin menu opens.
      Or use <b>Unpin app</b> here.</p>
    <p class="meta">Now: ${list.map(d => esc(label(d)) + " – " + (d.singleApp ? "📌 " + esc(appName(d, d.singleApp)) : "not pinned")).slice(0, 5).join("<br>")}${list.length > 5 ? "<br>…" : ""}</p>`,
    "📌 Pin app", () => command(list, "singleapp", { package: $("saPick").value, appName: $("saPick").selectedOptions[0].text }),
    [anyPinned ? "Unpin app" : "Unpin app (nothing pinned)", () => command(list, "unpin"), "danger"]);
}

// extra: optional second action, [label, handler, cssClass].
function dialog(html, okText, onOk, extra) {
  const d = $("dlg");

    ${okText ? `<button class="btn primary" value="ok">${esc(okText)}</button>` : ""}</div></form>`;
  d.onclose = () => { if (d.returnValue === "ok") onOk(); if (d.returnValue === "extra") extra[1](); };

  d.showModal();
}

// history rows: [time, battery, cpu, ram, disk, temp]
function chart(h) {
  if (!h || h.length < 2) return `<p class="empty">Collecting… a point is saved every 5 minutes.</p>`;
  const W = 600, H = 160, t0 = h[0][0], t1 = h[h.length - 1][0] || t0 + 1;
  const lines = [["Battery %", 1, css("--ok")], ["Memory %", 3, "#3b82f6"], ["Storage %", 4, css("--accent")]];
  const x = t => 4 + (W - 8) * (t - t0) / Math.max(1, t1 - t0), y = v => H - 6 - (H - 12) * v / 100;
  const paths = lines.filter(([, i]) => h.some(r => r[i] != null)).map(([n, i, c]) =>
    `<polyline fill="none" stroke="${c}" stroke-width="2" points="${h.filter(r => r[i] != null).map(r => x(r[0]).toFixed(1) + "," + y(r[i]).toFixed(1)).join(" ")}"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${[25, 50, 75].map(v => `<line x1="0" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--line")}" stroke-dasharray="3 4"/>`).join("")}${paths.join("")}</svg>
    <div class="legend">${lines.filter(([, i]) => h.some(r => r[i] != null)).map(([n, , c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}
      <span>${new Date(t0).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })} → now</span></div>`;
}

async function upload(kind, file, labelText) {
  const q = new URLSearchParams({ kind, name: file.name, ...(labelText ? { label: labelText } : {}) });
  // Cloud: the file goes straight to storage, then the server checks it. Office PC: start returns no link.
  const s = await api("/api/upload/start?" + q, {});
  if (s.uploadUrl) {
    const put = await fetch(s.uploadUrl, { method: "PUT", body: file });
    if (!put.ok) throw new Error("upload HTTP " + put.status);
    return api("/api/upload/finish?" + q, { id: s.id });
  }
  const r = await fetch("/api/upload?" + q, { method: "POST", body: file });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "HTTP " + r.status);
}

        <label class="chip"><input type="radio" name="role" value="ro" ${x?.readOnly ? "checked" : ""}>View only</label>
        <label class="chip"><input type="radio" name="role" value="admin" ${x?.admin ? "checked" : ""}>Administrator</label></div>
      <label>Sites</label><div class="chips" id="uSites">${chip("site", "*", all, "All sites")}
        ${S.sites.map(s => chip("site", s.name, !all && (x?.sites || []).includes(s.name), s.name)).join("")}</div>
      <label>Pages</label><div class="chips" id="uMods">${(S.modules || Object.keys(MODULE_NAMES)).map(m => chip("mod", m, mods.includes(m), MODULE_NAMES[m] || m)).join("")}</div>
      <label>Status</label><label class="chip" style="justify-self:start"><input type="checkbox" id="uOff" ${x?.disabled ? "checked" : ""}>Disabled (can't sign in)</label>
    </div>`, x ? "Save" : "Create user", () => {
    const val = sel => [...$("dlg").querySelectorAll(sel)].filter(i => i.checked).map(i => i.value);
    const role = val("input[name=role]")[0];
    act(() => api("/api/users", { isNew: !x, username: x ? x.username : $("uName").value.trim(), name: $("uFull").value, password: $("uPw").value,
      admin: role === "admin", readOnly: role === "ro", disabled: $("uOff").checked, sites: val("input[name=site]"), modules: val("input[name=mod]") }),
      x ? "Saved" : "User created");
  });
  $("dlg").classList.add("wide");
  $("dlg").addEventListener("close", () => $("dlg").classList.remove("wide"), { once: true });
  // "All sites" and picking single sites are exclusive; administrators always get everything
  const sync = () => {
    const allOn = $("dlg").querySelector("input[name=site][value='*']").checked, admin = $("dlg").querySelector("input[name=role][value=admin]").checked;
    for (const i of $("dlg").querySelectorAll("input[name=site]:not([value='*'])")) { i.closest(".chip").classList.toggle("off", allOn || admin); if (allOn) i.checked = false; }
    $("dlg").querySelector("input[name=site][value='*']").closest(".chip").classList.toggle("off", admin);
    for (const i of $("dlg").querySelectorAll("input[name=mod]")) i.closest(".chip").classList.toggle("off", admin);
  };
  $("dlg").querySelector(".ugrid").onchange = sync;
  sync();
}

VIEWS.features = () => {
  const P = { done: ["ok", "Done"], partial: ["warn", "Partly"], next: ["neutral", "Next phase"], later: ["neutral", "Later"] };
  const n = k => FEATURES.filter(f => f[1] === k).length;
  $("view").innerHTML = `<h2>Features</h2><p class="lead">${n("done")} done · ${n("partial")} partly done · ${n("next") + n("later")} to come.</p>
    <div class="card feat"><table><tbody>${FEATURES.map(([f, s, note]) => `<tr><td><div class="name">${esc(f)}</div><div class="meta">${esc(note)}</div></td>
      <td><span class="pill ${P[s][0]}">${P[s][1]}</span></td></tr>`).join("")}</tbody></table></div>`;
};

// ---------------- map (opens from the header) ----------------
let map, markers = {}, fitted = false;
function drawMap() {
  if (!map) {
    map = L.map("map").setView([1.3521, 103.8198], 11);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: "Imagery &copy; Esri" });
    const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 });
    const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" });
    L.layerGroup([sat, labels]).addTo(map);
    L.control.layers({ "Satellite": L.layerGroup([sat, labels]), "Street": street }).addTo(map);
  }
  const seen = new Set();
  for (const d of S.devices) {
    if (d.lat == null) continue;
    seen.add(d.id);
    const popup = `<b>${esc(label(d))}</b><br>${isOnline(d) ? "Online" : "Offline"}${d.battery != null ? " · battery " + d.battery + "%" : ""}<br>
      <span class="meta">±${Math.round(d.accuracy || 0)} m · ${ago(d.locationTime)}</span><br><a href="#/device/${encodeURIComponent(d.id)}" onclick="$('mapDlg').close()">Open device →</a>`;
    markers[d.id] ||= L.circleMarker([d.lat, d.lng], { radius: 9, weight: 3, fillOpacity: .95 }).addTo(map);
    markers[d.id].setLatLng([d.lat, d.lng]).setStyle({ color: "#fff", fillColor: isOnline(d) ? "#22c55e" : "#ef4444" }).bindPopup(popup);
  }
  for (const id in markers) if (!seen.has(id)) { markers[id].remove(); delete markers[id]; }
  const pts = Object.values(markers).map(m => m.getLatLng());
  if (!fitted && pts.length) { map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 17 }); fitted = true; }
}
function openMap(d) {
  $("mapDlg").showModal();
  drawMap();
  map.invalidateSize();
  if (Array.isArray(d)) {
    const pts = d.filter(x => markers[x.id]).map(x => markers[x.id].getLatLng()), n = d.length - pts.length;
    if (pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 17 });
    if (n) toast(`${n} device${n > 1 ? "s have" : " has"} no location`);
    return;
  }
  if (d) {
    if (!markers[d.id]) return toast("No location from this device yet", true);
    map.setView(markers[d.id].getLatLng(), 18);
    markers[d.id].openPopup();
  }
  const n = S.devices.filter(x => x.lat == null).length;
  if (!d && n) toast(`${n} device${n > 1 ? "s have" : " has"} no location (no GPS or not an Android device)`);
}
$("mapBtn").onclick = () => openMap();
const THEME_ICON = { auto: "sun-moon", light: "sun", dark: "moon" };
function themeBtn(b, after) {
  const show = () => { b.innerHTML = ico(THEME_ICON[themePref()]); b.title = "Theme: " + themePref() + " (click to change)"; };
  b.onclick = () => {
    const next = { auto: "light", light: "dark", dark: "auto" }[themePref()];
    try { localStorage.setItem("theme", next); } catch {}
    document.documentElement.classList.add("theming");
    applyTheme(); show(); after?.();
    setTimeout(() => document.documentElement.classList.remove("theming"), 500);
  };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { applyTheme(); after?.(); });
  show();
}
themeBtn($("themeBtn"), () => route(true));
$("mapBtn").querySelector(".mapico").outerHTML = ico("map");
document.querySelector(".bellico").outerHTML = ico("bell");
$("logout").querySelector(".outico").outerHTML = ico("log-out"); // donut/chart colours are read from CSS at draw time
$("logout").onclick = async () => { await fetch("/api/logout", { method: "POST" }); location.href = "/login"; };

route(false);
refresh();
setInterval(refresh, 5000);
</script>

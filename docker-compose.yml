# On the VM: put this file, Caddyfile and a .env (see .env.compose.example) in the same directory, then:
#   docker compose pull && docker compose up -d
services:
  portal:
    image: ghcr.io/ashik-greenbotz/mdm:latest
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set a strong ADMIN_PASSWORD in .env}
      DEVICE_KEY: ${DEVICE_KEY:?set a random DEVICE_KEY in .env}
      TIME_ZONE: ${TIME_ZONE:-Asia/Singapore}
      TUNNEL_PASSWORD: ${TUNNEL_PASSWORD:-}
      TUNNEL_HOST: ${TUNNEL_HOST:-}
      # Max, the AI assistant (optional)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
    volumes:
      - portal-data:/app/server

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - portal

  # Remote SSH: tablets open reverse tunnels here (ports 21000-29999 inside this container only);
  # people jump through it: ssh -J tunnel@<host>:2222 -p 2<Device ID> kiosk@localhost
  # ponytail: one shared tunnel password; per-user keys if more people get access.
  tunnel:
    profiles: [ssh] # starts only with COMPOSE_PROFILES=ssh in .env, so deploys work before the VM is set up
    image: lscr.io/linuxserver/openssh-server:latest
    restart: unless-stopped
    ports:
      - "2222:2222"
    environment:
      USER_NAME: tunnel
      PASSWORD_ACCESS: "true"
      USER_PASSWORD: ${TUNNEL_PASSWORD:-}
      DOCKER_MODS: linuxserver/mods:openssh-server-ssh-tunnel

volumes:
  portal-data:
  caddy-data:
  caddy-config:

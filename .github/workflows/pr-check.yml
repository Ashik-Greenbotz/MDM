name: PR checks

on:
  pull_request:
    branches: [main]
    paths:
      - "functions/server.js"
      - "dashboard/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "Caddyfile"
      - ".github/workflows/pr-check.yml"

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check server.js
        run: node --check functions/server.js

      - name: Validate docker-compose.yml
        run: ADMIN_PASSWORD=dummy DEVICE_KEY=dummy docker compose config -q

      - name: Validate Caddyfile
        run: |
          docker run --rm -v "${{ github.workspace }}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mdm-portal:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name portal-smoke -p 8080:8080 mdm-portal:pr-${{ github.event.pull_request.number }}
          ok=
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/login > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "server did not respond in time"
            docker logs portal-smoke
            exit 1
          fi
          echo "server responded on /login"

      - name: Clean up
        if: always()
        run: docker rm -f portal-smoke || true
